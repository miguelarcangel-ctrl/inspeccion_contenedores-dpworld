const Date_=s=>new Date(s).getTime(), D=Date_, DAY=24*3600000;
const SHIFT=Math.round((Date.now()-Date_('2026-10-16T09:00:00-05:00'))/DAY)*DAY;

const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('es-PA',{timeZone:'America/Panama',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).replace(/,/g,'').replace(/\./g,'');

const ago=t=>{const m=Math.round((Date.now()-t)/MIN);if(m<1)return'ahora';if(m<60)return'hace '+m+' min';const h=Math.floor(m/60);return h<24?'hace '+h+' h '+(m%60)+' min':'hace '+Math.floor(h/24)+' d';};

let state, ui={auth:false,user:'',role:'cliente',carrier:'c1',sec:'main',open:{}};

/* sesión: cada usuario activa solo las vistas de su rol */

const SECTIONS={cliente:[['main','Mis bookings']],transportista:[['main','Bookings']],bodega:[['main','Bookings'],['rampas','Rampas']],admin:[['main','Panel'],['rampas','Rampas']]};

/* Control de Rampas (bodega CLP): estados de la operación SALIDA mientras el contenedor está en bodega */

const RST={
 ESPERA_RAMPA:{l:'En cola de rampa',s:'ESPERA',c:'#f5a20b',g:'rgba(245,162,11,.4)',p:'wait'},
 PEND_INSP:{l:'Pend. inspección',s:'INSP!',c:'#E8003D',g:'rgba(232,0,61,.5)',p:'off'},
 INSPECCIONADO:{l:'Inspeccionado',s:'INSP OK',c:'#00C389',g:'rgba(0,195,137,.5)',p:'on'},
 P20:{l:'20 % en proceso',s:'20%',c:'#ff6830',g:'rgba(255,104,48,.4)',p:'wait'},
 P50:{l:'50 % en proceso',s:'50%',c:'#f5a20b',g:'rgba(245,162,11,.4)',p:'wait'},
 P100:{l:'100 % completado',s:'100%',c:'#00C389',g:'rgba(0,195,137,.5)',p:'on'},
 BUFFER_POST:{l:'En buffer · sellado',s:'BUFF',c:'rgba(255,255,255,.35)',g:'rgba(255,255,255,.1)',p:'on'}};

function mkContainers(n,status,carrierId,nav,opts){
  opts=opts||{};
  return Array.from({length:n},(_,i)=>{
    const c={id:uid('k'),seq:i+1,status:status,carrierId:carrierId||null,confId:opts.confId||null,number:'',driver:'',plate:'',seal:'',loaded:null,proofs:[]};
    if(IDX[status]>=IDX.retiro){c.number=cnum(nav);c.driver=DRIVERS[rnd(DRIVERS.length)];c.plate=plate();c.proofs.push({type:'EIR retiro',name:'EIR_'+c.number.replace(/\W/g,'')+'.pdf',by:'transportista'});}
    if(IDX[status]>=IDX.bodega){c.seal=String(4400000+rnd(99999));c.loaded=opts.boxes||null;c.proofs.push({type:'Foto puerta + sello',name:'sello_'+c.seal+'.jpg',by:'bodega'});}
    if(IDX[status]>=IDX.entregado){c.proofs.push({type:'EIR entrega lleno',name:'EIR_full_'+c.number.replace(/\W/g,'')+'.pdf',by:'transportista'});}
    return c;});
}
function seed(){
  const now=Date.now();
  const D=x=>Date_(x)+SHIFT;
  const atlas={desc:'Cerveza Atlas lata 355 ml',skus:[{sku:'ATL-355-24',d:'Atlas lata 355 ml · caja 24 u',q:1540}],notes:'Carga a piso, sin pallets. 1.540 cajas por 40\'HC. Colocar 4 bolsas de desecante. No mezclar lotes de producción en un mismo contenedor. Foto al 50 % y con puertas cerradas antes de sellar.'};
  const mixto={desc:'Mixto Balboa / Panamá botella retornable',skus:[{sku:'BAL-330-24',d:'Balboa botella 330 ml · caja 24 u',q:900},{sku:'PAN-330-24',d:'Panamá botella 330 ml · caja 24 u',q:600}],notes:'Balboa al fondo, Panamá hacia la puerta. Separador de cartón entre marcas. Máximo 7 cajas de alto.'};
  const vigor={desc:'Malta Vigor lata 355 ml',skus:[{sku:'VIG-355-24',d:'Malta Vigor lata 355 ml · caja 24 u',q:980}],notes:'Contenedor 20\': 980 cajas. Revisar piso del contenedor (limpio y seco) antes de cargar; rechazar si huele a químico.'};
  const b=[];
  const B1={id:'b1',ref:'MAEU 258741963',naviera:'Maersk',size:'40\' HC',qty:21,pickFrom:D('2026-10-16T07:00:00-05:00'),pickTo:D('2026-10-17T12:00:00-05:00'),pickLoc:PICK[0],delFrom:D('2026-10-20T06:00:00-05:00'),delTo:D('2026-10-21T18:00:00-05:00'),delLoc:DELIV[0],docs:['Booking_MAEU258741963.pdf','Release_vacios_Maersk.pdf'],cargo:atlas,createdAt:now-27*MIN,publishedAt:now-25*MIN,mode:'abierto',directTo:null,hidden:[]};
  B1.containers=[].concat(mkContainers(12,'confirmado','c1','Maersk',{confId:'f1'}),mkContainers(5,'confirmado','c3','Maersk',{confId:'f2'}),mkContainers(4,'publicado',null,'Maersk'));
  B1.containers.forEach((c,i)=>c.seq=i+1);
  const B2={id:'b2',ref:'HLCU COL2610458',naviera:'Hapag-Lloyd',size:'40\' HC',qty:8,pickFrom:D('2026-10-16T13:00:00-05:00'),pickTo:D('2026-10-17T12:00:00-05:00'),pickLoc:PICK[1],delFrom:D('2026-10-20T06:00:00-05:00'),delTo:D('2026-10-20T20:00:00-05:00'),delLoc:DELIV[1],docs:['Booking_HLCU_COL2610458.pdf'],cargo:mixto,createdAt:now-74*MIN,publishedAt:now-72*MIN,mode:'abierto',directTo:null,hidden:[]};
  B2.containers=mkContainers(8,'publicado',null,'Hapag-Lloyd');
  const B3={id:'b3',ref:'CMDU PAN0918822',naviera:'CMA CGM',size:'20\' DV',qty:6,pickFrom:D('2026-10-14T07:00:00-05:00'),pickTo:D('2026-10-15T12:00:00-05:00'),pickLoc:PICK[2],delFrom:D('2026-10-15T14:00:00-05:00'),delTo:D('2026-10-16T18:00:00-05:00'),delLoc:DELIV[2],docs:['Booking_CMDU_PAN0918822.pdf','Instrucciones_naviera.pdf'],cargo:vigor,createdAt:now-30*HOUR,publishedAt:now-30*HOUR,mode:'directo',directTo:'c2',hidden:[]};
  B3.containers=[].concat(mkContainers(2,'transito','c2','CMA CGM',{boxes:980}),mkContainers(1,'bodega','c2','CMA CGM',{boxes:980}),mkContainers(3,'retiro','c2','CMA CGM'));
  Object.assign(B3.containers[3],{ramp:'P50',rampa:'R2'});Object.assign(B3.containers[4],{ramp:'PEND_INSP',rampa:'R4'});
  B3.containers.forEach((c,i)=>c.seq=i+1);
  const B4={id:'b4',ref:'MEDU PA7710451',naviera:'MSC',size:'40\' HC',qty:4,pickFrom:D('2026-10-12T07:00:00-05:00'),pickTo:D('2026-10-13T12:00:00-05:00'),pickLoc:PICK[3],delFrom:D('2026-10-14T06:00:00-05:00'),delTo:D('2026-10-14T18:00:00-05:00'),delLoc:DELIV[0],docs:['Booking_MEDU_PA7710451.pdf'],cargo:atlas,createdAt:now-80*HOUR,publishedAt:now-80*HOUR,mode:'directo',directTo:'c1',hidden:[]};
  B4.containers=[].concat(mkContainers(2,'devuelto','c1','MSC',{boxes:1540}),mkContainers(2,'entregado','c1','MSC',{boxes:1540}));
  B4.containers.forEach((c,i)=>c.seq=i+1);
  const B5={id:'b5',ref:'ONEU PTY5562018',naviera:'ONE',size:'40\' DV',qty:10,pickFrom:D('2026-10-17T07:00:00-05:00'),pickTo:D('2026-10-19T12:00:00-05:00'),pickLoc:PICK[4],delFrom:D('2026-10-21T06:00:00-05:00'),delTo:D('2026-10-21T18:00:00-05:00'),delLoc:DELIV[1],docs:['Booking_ONEU_PTY5562018.pdf'],cargo:mixto,createdAt:now-9*MIN,publishedAt:now-8*MIN,mode:'directo',directTo:'c1',hidden:[]};
  B5.containers=mkContainers(10,'publicado',null,'ONE');
  b.push(B5,B1,B2,B3,B4);
  return {settings:{mode:'abierto',preferred:'c1'},bookings:b,
    confs:[{id:'f1',bookingId:'b1',carrierId:'c1',qty:12,units:12,note:'12 cabezales con chasis 40\' disponibles desde vie 06:00.',at:now-6*MIN,status:'pendiente'},
           {id:'f2',bookingId:'b1',carrierId:'c3',qty:5,units:5,note:'Podemos cubrir 5 el sábado en la mañana.',at:now-3*MIN,status:'pendiente'}],
    log:[{at:now-3*MIN,t:'Rutas del Caribe confirmó 5 contenedores de MAEU 258741963'},{at:now-6*MIN,t:'Costa Atlántica confirmó 12 contenedores de MAEU 258741963'},{at:now-8*MIN,t:'CERNAC creó ONEU PTY5562018 · 10 × 40\' DV · directo a Costa Atlántica'},{at:now-25*MIN,t:'CERNAC creó MAEU 258741963 · 21 × 40\' HC · publicado abierto'},{at:now-72*MIN,t:'CERNAC creó HLCU COL2610458 · 8 × 40\' HC · publicado abierto'}]};
}
/* archivos adjuntos: IndexedDB del navegador (sobreviven a recargas; localStorage no alcanza para PDF) */
const FILES=(()=>{let db=null;
  const open=()=>db||(db=new Promise((res,rej)=>{const r=indexedDB.open('dpw-lastmile-archivos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=(modo,fn)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('f',modo),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));
  return {put:(k,v)=>tx('readwrite',st=>st.put(v,k)),get:k=>tx('readonly',st=>st.get(k)),clear:()=>tx('readwrite',st=>st.clear())};})();
const MAX_MB=10;
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name);
function samplePdf(lines){
  // PDF mínimo (una página, Helvetica) para los documentos de los datos de ejemplo
  const t=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'-').replace(/[\\()]/g,'\\$&');
  const body='BT /F1 18 Tf 56 740 Td ('+t(lines[0])+') Tj /F1 11 Tf'+lines.slice(1).map(l=>' 0 -24 Td ('+t(l)+') Tj').join('')+' ET';
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream'];
  let out='%PDF-1.4\n';const offs=objs.map((o,i)=>{const at=out.length;out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';return at;});
  const xref=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return new Blob([out],{type:'application/pdf'});
}
async function downloadDoc(key,name,ref){
  let blob=null;try{blob=await FILES.get(key);}catch(e){}
  if(!blob){blob=samplePdf(['DP World · Last Mile','Documento de ejemplo: '+name,'Booking: '+ref,'Generado por el prototipo: el archivo original no se subió en esta demo.']);name=name.replace(/\.[^.]+$/,'')+'_ejemplo.pdf';}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
}

function save(){try{localStorage.setItem(KEY,JSON.stringify({state:state,ui:ui}));}catch(e){}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.state&&r.state.bookings){state=r.state;ui=Object.assign(ui,r.ui||{});ui.open=ui.open||{};return;}}catch(e){}state=seed();}
function log(t){state.log.unshift({at:Date.now(),t:t});state.log=state.log.slice(0,60);}

/* derived */
const B=id=>state.bookings.find(x=>x.id===id);
const deadline=b=>b.publishedAt+HOUR;
const openCount=b=>b.containers.filter(c=>c.status==='publicado').length;
const expired=b=>openCount(b)>0&&Date.now()>deadline(b);
function counts(b){const o={};ST.forEach(s=>o[s.k]=0);b.containers.forEach(c=>o[c.status]++);return o;}
function minIdx(b){return Math.min.apply(null,b.containers.map(c=>IDX[c.status]));}
function stagePill(b,role){
  const ct=counts(b);
  if(ct.devuelto===b.containers.length) return '<span class="cli-badge on">Completado</span>';
  if(role==='cliente'){
    if(ct.publicado+ct.confirmado>0) return '<span class="cli-badge wait">Programando transporte</span>';
    const k=ST[minIdx(b)].k; return '<span class="cli-badge '+(IDX[k]>=IDX.entregado?'on':'tr')+'">'+(k==='asignado'?'Transporte asignado':LBL[k])+'</span>';}
  if(expired(b)) return '<span class="cli-badge off">Vencido sin cubrir</span>';
  if(ct.publicado>0) return '<span class="cli-badge wait">Publicado · '+ct.publicado+' sin cubrir</span>';
  if(ct.confirmado>0) return '<span class="cli-badge wait">Por aprobar</span>';
  const k=ST[minIdx(b)].k; return '<span class="cli-badge '+(IDX[k]>=IDX.entregado?'on':'tr')+'">'+LBL[k]+'</span>';
}
function bar(b){
  const ct=counts(b),n=b.containers.length;
  return '<div class="bar" role="img" aria-label="Avance por estado">'+ST.map((s,i)=>ct[s.k]?'<span style="width:'+(ct[s.k]/n*100)+'%;background:var(--seg-'+i+')" title="'+esc(s.l)+': '+ct[s.k]+'"></span>':'').join('')+'</div>'+
   '<div class="legend">'+ST.map((s,i)=>ct[s.k]?'<span><i style="background:var(--seg-'+i+')"></i>'+esc(s.l)+' <b class="num">'+ct[s.k]+'</b></span>':'').join('')+'</div>';
}
const clockSvg='<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function clock(b){if(!openCount(b))return'';return '<span class="clock" data-dl="'+deadline(b)+'">'+clockSvg+'<span></span></span>';}
function tickClocks(){
  document.querySelectorAll('[data-dl]').forEach(el=>{
    const left=+el.dataset.dl-Date.now(), s=el.querySelector('span');
    el.classList.toggle('warn',left>0&&left<15*MIN); el.classList.toggle('over',left<=0);
    if(left>0){const m=Math.floor(left/MIN),sec=Math.floor(left%MIN/1000);s.textContent=m+':'+String(sec).padStart(2,'0')+' para confirmar';}
    else s.textContent='Plazo de 1 h vencido · '+ago(+el.dataset.dl).replace('hace ','hace ');
  });
}
function windows(b){
  return '<div class="win"><div><span class="flbl">Retiro de vacío</span><span class="t">'+fmt(b.pickFrom)+' → '+fmt(b.pickTo)+'</span><span class="loc">'+esc(b.pickLoc)+'</span></div>'+
    '<div><span class="flbl">Entrega lleno</span><span class="t">'+fmt(b.delFrom)+' → '+fmt(b.delTo)+'</span><span class="loc">'+esc(b.delLoc)+'</span></div></div>';
}
function idRow(b,extra){return '<div class="bk-id"><span class="bk-ref">'+esc(b.ref)+'</span><span class="tag size">'+b.qty+' × '+esc(b.size)+'</span><span class="tag">'+esc(b.naviera)+'</span>'+(extra||'')+'</div>';}
const dlIcon='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0L4.8 6.8M8 10l3.2-3.2M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function docBtn(key,name,ref,label){return '<button type="button" class="doc" data-act="doc" data-k="'+esc(key)+'" data-n="'+esc(name)+'" data-r="'+esc(ref)+'" title="Descargar '+esc(name)+'">'+dlIcon+esc(label||name)+'</button>';}
function docsHtml(b){const list=b.docs||[];if(!list.length)return'<span class="muted">Sin documentos</span>';return '<div class="docs">'+list.map(n=>docBtn(b.id+'/'+n,n,b.ref)).join('')+'</div>';}
function cargoHtml(b,full){
  const c=b.cargo||{};
  return '<div class="cargo"><div class="row" style="justify-content:space-between"><span class="flbl">Detalle de carga · solo bodega y DP World</span></div>'+
    '<strong>'+esc(c.desc||'—')+'</strong>'+
    '<ul>'+(c.skus||[]).map(s=>'<li><span class="sku">'+esc(s.sku)+'</span><span>'+esc(s.d)+'</span><span class="muted num">'+(s.q?s.q.toLocaleString('es-PA')+' cajas / cont.':'')+'</span></li>').join('')+'</ul>'+
    (c.notes?'<div class="note"><b>Instrucciones especiales:</b> '+esc(c.notes)+'</div>':'')+'</div>';
}

/* rampas */
const rs=c=>c.status==='retiro'?(c.ramp||'ESPERA_RAMPA'):c.status==='bodega'?'BUFFER_POST':null;
function allC(){const o=[];state.bookings.forEach(b=>b.containers.forEach(c=>o.push({b:b,c:c})));return o;}
const rampOcc=r=>allC().find(x=>x.c.status==='retiro'&&x.c.rampa===r);
const freeRamps=()=>Array.from({length:RAMPS},(_,i)=>'R'+(i+1)).filter(r=>!rampOcc(r));
const cola=()=>allC().filter(x=>rs(x.c)==='ESPERA_RAMPA');
function rampBadge(c){const k=rs(c);return '<span class="cli-badge '+RST[k].p+'">'+(c.rampa?c.rampa+' · ':'')+RST[k].l+'</span>';}

/* filas de booking: prioridad + tracking */
const SHORT={publicado:'Publ.',confirmado:'Conf.',asignado:'Asig.',retiro:'Retiro',bodega:'Bodega',transito:'Tráns.',entregado:'Entreg.',devuelto:'Dev.'};
const TONE=k=>IDX[k]<=1?'wait':IDX[k]>=6?'on':'tr';
function prio(b){
  const ct=counts(b),n=b.containers.length;
  if(ct.publicado+ct.confirmado+ct.asignado>0)return {t:b.pickFrom,end:b.pickTo,l:'Retiro vacío'};
  if(ct.entregado+ct.devuelto<n)return {t:b.delFrom,end:b.delTo,l:'Entrega lleno'};
  return {t:b.delTo,end:b.delTo,l:'Entregado',done:true};
}
function byPrio(list){return list.slice().sort((a,b)=>{const x=prio(a),y=prio(b);return x.done!==y.done?(x.done?1:-1):x.done?y.t-x.t:x.t-y.t;});}
function rel(t){const m=Math.round((t-Date.now())/MIN),a=Math.abs(m),h=Math.floor(a/60),d=Math.floor(h/24);const v=a<60?a+' min':h<48?h+' h':d+' d';return m<0?'hace '+v:'en '+v;}
function trk(b){
  const ct=counts(b),n=b.containers.length,mx=Math.max.apply(null,b.containers.map(c=>IDX[c.status]));
  return '<div class="trk" role="img" aria-label="'+esc(ST.filter(x=>ct[x.k]).map(x=>x.l+': '+ct[x.k]).join(' · '))+'">'+ST.map((x,i)=>{
    const done=b.containers.every(c=>IDX[c.status]>i)&&!ct[x.k], cur=ct[x.k]>0;
    return '<span class="trk-c'+(i<=mx?' on':'')+'"><span class="pip-d '+(done?'done':cur?'cur '+TONE(x.k):'fut')+'" title="'+esc(x.l)+': '+ct[x.k]+'">'+(done?'✓':cur?ct[x.k]:'')+'</span></span>';}).join('')+'</div>';
}
function bkRows(sec,list,body,right,alert){
  if(!list.length)return '';
  return '<div class="bkl"><div class="bkl-h" aria-hidden="true"><span></span><span>Prioridad · desde / hasta</span><span>Booking</span><div class="trk">'+ST.map(x=>'<span>'+SHORT[x.k]+'</span>').join('')+'</div><span>Estado</span></div>'+
   byPrio(list).map(b=>{const k=sec+':'+b.id,p=prio(b),now=Date.now(),open=now>=p.t,closed=now>p.end;
    const tone=p.done?'done':closed?'over':(open||p.t-now<24*HOUR)?'soon':'';
    const st=closed?'cerrada '+rel(p.end):open?'abierta · cierra '+rel(p.end):'empieza '+rel(p.t);
    return '<details class="bkr'+((alert&&alert(b))?' alert':'')+'" data-key="'+k+'"'+(ui.open[k]?' open':'')+'><summary class="bkr-s">'+
     '<span class="bkr-chev" aria-hidden="true">›</span>'+
     (p.done?'<span class="bkr-p done"><b>Completado</b><span>Entrega lleno · '+fmt(p.end)+'</span></span>':
      '<span class="bkr-p '+tone+'"><span class="bkr-pl">'+p.l+'</span><b>'+fmt(p.t)+'</b><span>hasta '+fmt(p.end)+'</span><span class="bkr-st">'+st+'</span></span>')+
     '<span class="bkr-id"><span class="bk-ref">'+esc(b.ref)+'</span><span class="bkr-tags"><span class="tag size">'+b.qty+' × '+esc(b.size)+'</span><span class="tag">'+esc(b.naviera)+'</span></span></span>'+
     trk(b)+'<span class="bkr-r">'+right(b)+'</span></summary><div class="bkr-b">'+body(b)+'</div></details>';}).join('')+'</div>';
}

/* attention badges */
function attention(){
  const a={cliente:0,bodega:0,transportista:0,admin:0};
  state.bookings.forEach(b=>{
    b.containers.forEach(c=>{if(c.status==='retiro')a.bodega++;});
    if(openCount(b)&&!expired(b)&&(b.mode==='abierto'||b.directTo===ui.carrier)&&b.hidden.indexOf(ui.carrier)<0)a.transportista++;
    if(expired(b))a.admin++;});
  a.admin+=state.confs.filter(f=>f.status==='pendiente').length;
  return a;
}
function renderRoles(){
  const secs=SECTIONS[ui.role]||[], nav=document.getElementById('roles');
  const badge={bodega:{rampas:cola().length},admin:{main:attention().admin}}[ui.role]||{};
  nav.hidden=secs.length<2;
  nav.innerHTML=secs.length<2?'':secs.map(x=>'<button class="tab'+(ui.sec===x[0]?' active':'')+'" role="tab" aria-selected="'+(ui.sec===x[0])+'" data-act="sec" data-k="'+x[0]+'">'+x[1]+(badge[x[0]]?'<span class="badge">'+badge[x[0]]+'</span>':'')+'</button>').join('');
  document.getElementById('hdr-role').textContent=ui.role==='transportista'?CN[ui.carrier]:(USERS[ui.user]||{}).n||ui.role;
  const steps=[['cliente','Cliente crea booking'],['transportista','Transportista confirma ≤ 1 h'],['admin','DP World aprueba'],['transportista','Retiro de vacío → cola de rampa'],['bodega','Rampa: inspección, carga y sello'],['transportista','Entrega lleno y devuelve'],['cliente','Cliente ve todo bajo DP World']];
  document.getElementById('flow').innerHTML=steps.map((s,i)=>'<li class="'+(s[0]===ui.role?'on':'')+'"><b>'+(i+1)+'</b>'+s[1]+'</li>').join('');
}

/* ===== BODEGA ===== */
function vBodega(){
  const q=[],inR=[],coming=[],done=[];
  state.bookings.forEach(b=>{const ct=counts(b),cs=b.containers.filter(c=>c.status==='retiro');
    if(cs.some(c=>!c.rampa))q.push(b);
    if(cs.some(c=>c.rampa))inR.push(b);
    if(ct.publicado+ct.confirmado+ct.asignado>0)coming.push(b);
    if(ct.bodega)done.push(b);});
  const rows=(b,f,lbl)=>'<div class="tw"><table class="t" style="min-width:0"><thead><tr><th>#</th><th>Contenedor</th><th class="hide-sm">Unidad</th><th>Estado</th><th></th></tr></thead><tbody>'+
    b.containers.filter(f).map(c=>'<tr><td class="num">'+c.seq+'</td><td class="mono">'+esc(c.number)+'</td><td class="hide-sm">'+esc(c.plate)+' · '+esc(c.driver)+'</td><td>'+rampBadge(c)+(c.seal?' <span class="muted">· sello '+esc(c.seal)+'</span>':'')+'</td><td class="r"><button class="btn-p '+(lbl==='Asignar rampa'?'btn-green':'btn-navy')+' inl" data-act="rtap" data-b="'+b.id+'" data-c="'+c.id+'">'+lbl+'</button></td></tr>').join('')+'</tbody></table></div>';
  const card=(b,mode)=>{
    const ct=counts(b),cs=b.containers.filter(c=>c.status==='retiro');
    const head=mode==='cola'?'<span class="cli-badge wait">'+cs.filter(c=>!c.rampa).length+' en cola de rampa</span>':mode==='rampa'?'<span class="cli-badge tr">'+cs.filter(c=>c.rampa).length+' en rampa</span>':mode==='coming'?'<span class="cli-badge mute">'+(ct.publicado+ct.confirmado+ct.asignado)+' aún sin retirar</span>':'<span class="cli-badge on">'+ct.bodega+' cargados y sellados</span>';
    const t=mode==='cola'?rows(b,c=>c.status==='retiro'&&!c.rampa,'Asignar rampa'):mode==='rampa'?rows(b,c=>c.status==='retiro'&&c.rampa,'Abrir rampa'):mode==='done'?rows(b,c=>c.status==='bodega','Ver'):'';
    return '<article class="bk">'+windows(b)+'<div class="bk-main">'+cargoHtml(b)+t+'</div></article>';
  };
  const n=(arr,f)=>arr.reduce((s,b)=>s+b.containers.filter(f).length,0);
  const head=(b,mode)=>{const ct=counts(b),cs=b.containers.filter(c=>c.status==='retiro');return mode==='cola'?'<span class="cli-badge wait">'+cs.filter(c=>!c.rampa).length+' en cola</span>':mode==='rampa'?'<span class="cli-badge tr">'+cs.filter(c=>c.rampa).length+' en rampa</span>':mode==='coming'?'<span class="cli-badge mute">'+(ct.publicado+ct.confirmado+ct.asignado)+' sin retirar</span>':'<span class="cli-badge on">'+ct.bodega+' sellados</span>';};
  const sec=(title,cnt,arr,mode,empty)=>'<div class="sec"><div class="psect-hdr"><h2 class="psect-title">'+title+'</h2><span class="psect-cnt">'+cnt+'</span></div>'+(arr.length?bkRows('bo'+mode,arr,b=>card(b,mode),b=>head(b,mode)):'<div class="empty">'+empty+'</div>')+'</div>';
  return '<section class="view"><div class="vhead"><div><h1 class="sc-title">Bookings de bodega</h1><p class="sc-sub">Lo que viene a la bodega y qué cargar en cada contenedor. Los vacíos que retira el transportista entran solos a la cola de rampas; «Cargado en bodega» se marca al sellar en Rampas.</p></div><button class="btn-p btn-green inl" data-act="sec" data-k="rampas">Ir a rampas</button></div>'+
   sec('En cola de rampa · vacíos retirados',n(q,c=>c.status==='retiro'&&!c.rampa),q,'cola','No hay vacíos esperando rampa.')+
   sec('En rampa · inspección y carga',n(inR,c=>c.status==='retiro'&&c.rampa),inR,'rampa','No hay contenedores en rampa.')+
   sec('Próximas cargas',coming.length,coming,'coming','Sin bookings por llegar.')+
   sec('Cargados y sellados · esperando salida',n(done,c=>c.status==='bodega'),done,'done','Nada cargado pendiente de salir.')+'</section>';

/* ===== RAMPAS (mismo muelle que Control de Rampas) ===== */
function cbox(x,isBuf){
  const c=x.c,k=rs(c),st=RST[k],post=k==='BUFFER_POST';
  const fillH=k==='P20'?25:k==='P50'?55:(k==='P100'||post)?100:5;
  const sc={PEND_INSP:'pend-insp',INSPECCIONADO:'inspeccionado',P20:'p20',P50:'p50',P100:'p100',BUFFER_POST:'buffer-post'}[k]||'salida';
  const cls=isBuf?'bbox '+(post?'buffer-post':'salida'):'cbox '+sc;
  return '<div class="'+cls+'" style="height:'+(isBuf?90:148)+'px" role="button" tabindex="0" aria-label="'+esc(c.number+' · '+st.l)+'" data-act="rtap" data-b="'+x.b.id+'" data-c="'+c.id+'">'+
    '<div class="cfill" style="height:'+fillH+'%;background:'+((k==='P100'||post)?'rgba(0,195,137,0.2)':'rgba(245,162,11,0.2)')+'"></div><div class="ccont">'+
    '<div class="ctag" style="background:'+(post?'rgba(0,195,137,.15)':'rgba(245,162,11,.15)')+';color:'+(post?'#00C389':'#f5a20b')+'">'+st.s+'</div>'+
    '<div class="cvert" style="flex-direction:column-reverse;gap:2px"><div class="ctext-v" style="color:'+st.c+';text-shadow:0 0 6px '+st.g+';flex:1;overflow:hidden">'+esc(c.number.replace(/\s/g,''))+'</div><div class="ctext-v" style="font-size:6.5px;color:var(--t3);letter-spacing:.3px;font-weight:600;flex:none">CERNAC</div></div></div></div>';
}
function vRampas(){
  const all=allC(),q=cola(),post=all.filter(x=>x.c.status==='bodega'),inR=all.filter(x=>x.c.status==='retiro'&&x.c.rampa);
  const pend=inR.filter(x=>x.c.ramp==='PEND_INSP').length;
  let doors='<div class="wh-bl">CLP</div>',slots='';
  for(let i=1;i<=RAMPS;i++){const r='R'+i,x=rampOcc(r);
    doors+='<div class="rdoor"><div class="dframe"><div class="dseal"></div><div class="dnum">'+r+'</div></div></div>';
    slots+='<div class="rslot"><div class="rpipe"></div>'+(x?cbox(x,false):'<div class="cbox libre" role="button" tabindex="0" aria-label="Rampa '+r+' libre" data-act="rfree" data-r="'+r+'"><div class="ccont"><div class="libre-plus"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="libre-lbl">Libre</div></div></div>')+'<div class="chassis"><div class="wheel"></div><div class="wheel"></div></div></div>';}
  const buf=q.concat(post);let bs='';
  for(let i=1;i<=BUFFER;i++){const x=buf[i-1];bs+='<div class="bslot"><div class="bpipe"></div>'+(x?cbox(x,true):'<div class="bbox libre-b"></div>')+'<div class="bnum">B'+i+'</div></div>';}
  const sb=(n,cls,l)=>'<div class="sbox"><div class="sn '+cls+'">'+n+'</div><div class="sl2">'+l+'</div></div>';
  return '<section class="view"><div class="vhead"><div><h1 class="sc-title">Control de Rampas · CLP</h1><p class="sc-sub">Los vacíos que retira el transportista llegan solos a la cola. Toca uno en cola para asignarle rampa; toca la rampa para inspeccionar, cargar y sellar.</p></div>'+(ui.role==='bodega'?'<button class="btn-p btn-navy inl" data-act="sec" data-k="main">Ver bookings</button>':'')+'</div>'+
   '<div class="stats">'+sb(RAMPS-inR.length,'sl','Rampas libres')+sb(q.length,q.length?'sa':'sl','En cola')+sb(pend,pend?'er':'sl','Pend. inspección')+sb(inR.length-pend,'en','En carga')+sb(post.length,'ok','Sellados en buffer')+'</div>'+
   '<div class="dock-wrap"><div class="wh-wall"><div class="wh-inner">'+doors+'</div></div><div class="rscroll"><div class="rinner">'+slots+'</div></div><div class="dlane"><div class="dlane-lbl">ZONA DE MANIOBRA</div></div>'+

   '<p class="muted" style="font-size:12px">Solo se muestran las operaciones de SALIDA que vienen de bookings. En la app integrada conviven con las ENTRADAS que hoy se registran a mano.</p></section>';
}

  else if(k==='P100'){

async function submitNew(){
  const v=id=>document.getElementById(id).value.trim();
  const err=document.getElementById('nbErr');
  const ref=v('rf').toUpperCase(), qty=parseInt(v('qt'),10);
  const pf=new Date(v('pf')).getTime(),pt=new Date(v('pt')).getTime(),df=new Date(v('df')).getTime(),dt=new Date(v('dt')).getTime();
  if(!ref){err.textContent='Escribe el número de booking.';return;}
  if(!(qty>0)){err.textContent='La cantidad debe ser al menos 1.';return;}
  if(!(pt>pf)){err.textContent='El fin del retiro de vacío debe ser posterior al inicio.';return;}
  if(!(dt>df)){err.textContent='El fin de la entrega lleno debe ser posterior al inicio.';return;}
  if(df<pf){err.textContent='La entrega lleno no puede empezar antes del retiro de vacío.';return;}
  const bkPdf=(document.getElementById('dcb').files||[])[0];
  if(bkPdf&&!isPdf(bkPdf)){err.textContent='El booking debe ser un archivo PDF.';return;}
  const files=(bkPdf?[bkPdf]:[]).concat(Array.from(document.getElementById('dc').files||[])).filter((f,i,a)=>a.findIndex(x=>x.name===f.name)===i);
  const big=files.find(f=>f.size>MAX_MB*1048576);
  if(big){err.textContent=big.name+' pesa más de '+MAX_MB+' MB.';return;}
  const skus=Array.from(document.querySelectorAll('#skus .skurow')).map(r=>{const i=r.querySelectorAll('input');return {sku:i[0].value.trim(),d:i[1].value.trim(),q:parseInt(i[2].value,10)||0};}).filter(x=>x.sku||x.d);
  const s=state.settings, nav=v('nv');
  const b={id:uid('b'),ref:ref,naviera:nav,size:v('sz'),qty:qty,pickFrom:pf,pickTo:pt,pickLoc:v('pl'),delFrom:df,delTo:dt,delLoc:v('dl'),docs:files.map(f=>f.name),cargo:{desc:v('cd'),skus:skus,notes:v('cn')},createdAt:Date.now(),publishedAt:Date.now(),mode:s.mode,directTo:s.mode==='directo'?s.preferred:null,hidden:[],containers:mkContainers(qty,'publicado',null,nav)};
  let saved=true;
  try{await Promise.all(files.map(f=>FILES.put(b.id+'/'+f.name,f)));}catch(e){saved=false;}
  state.bookings.push(b);
  log('CERNAC creó '+ref+' · '+qty+' × '+b.size+' · '+(b.mode==='directo'?'directo a '+CN[b.directTo]:'publicado abierto'));
  closeModal();commit();toast('Booking '+ref+' recibido. DP World está programando el transporte.');
  if(!saved)toast('Este navegador no permitió guardar los adjuntos.',true);
}

  if(!(q>=1&&q<=n)){document.getElementById('cErr').textContent='Indica entre 1 y '+n+' contenedores.';return;}

  b.containers.filter(c=>c.status==='publicado').slice(0,q).forEach(c=>{c.status='confirmado';c.carrierId=ui.carrier;c.confId=f.id;});
  state.confs.push(f);log(CN[ui.carrier]+' confirmó '+q+' contenedores de '+b.ref);
  closeModal();commit();toast('Confirmación enviada. Queda pendiente de aprobación de DP World.');
}
const STEP={
  retiro:{t:'Retiro de vacío',fields:[['num','Número de contenedor','text',true],['drv','Chofer','text',true],['plt','Placa del cabezal','text',true]],proof:'EIR retiro'},
  bodega:{t:'Cargado en bodega',fields:[['seal','Número de sello','text',true],['box','Cajas cargadas','number',true]],proof:'Foto puerta + sello'},
  transito:{t:'En tránsito',fields:[],proof:null},
  entregado:{t:'Entregado lleno',fields:[],proof:'EIR entrega lleno'},
  devuelto:{t:'Devuelto',fields:[],proof:null}};
function advForm(bid,cid,to){
  const b=B(bid),c=b.containers.find(x=>x.id===cid),st=STEP[to];
  const planned=((b.cargo||{}).skus||[]).reduce((s,x)=>s+(x.q||0),0);
  const def={num:cnum(b.naviera),drv:DRIVERS[rnd(DRIVERS.length)],plt:plate(),seal:String(4400000+rnd(99999)),box:planned||''};
  openModal('<div class="sh-h"><div><span class="flbl">'+esc(b.ref)+' · contenedor '+c.seq+'</span><h3 class="mtitle">'+st.t+'</h3></div><button class="mclose" data-act="close" aria-label="Cerrar">×</button></div>'+
  '<div class="sh-b form">'+(to==='bodega'?cargoHtml(b):'')+
  (st.fields.length?'<div class="fgrid">'+st.fields.map(f=>'<label class="f"><span class="flbl">'+f[1]+'</span><input class="fin'+(f[0]==='num'?' mono':'')+'" id="fx-'+f[0]+'" type="'+f[2]+'" value="'+esc(def[f[0]])+'"></label>').join('')+'</div>':'')+
  (st.proof?'<label class="f"><span class="flbl">Prueba · '+st.proof+'</span><input class="fin" type="file" id="fx-file" accept="image/*,application/pdf"></label>':'')+
  (to==='retiro'?'<div class="abox inf">El cliente verá chofer y placa como unidad DP World. Al marcar el retiro, el contenedor entra solo a la cola de rampas de bodega.</div>':'')+
  (planned&&to==='bodega'?'<div class="abox inf">Plan del cliente: '+planned.toLocaleString('es-PA')+' cajas por contenedor.</div>':'')+
  '<div class="err" id="aErr"></div></div><div class="sh-f"><button class="btn-p btn-navy inl" data-act="close">Cancelar</button><button class="btn-p btn-green inl" data-act="doAdv" data-b="'+bid+'" data-c="'+cid+'" data-to="'+to+'">Marcar '+st.t.toLowerCase()+'</button></div>',true);
}
function doAdv(bid,cid,to){
  const b=B(bid),c=b.containers.find(x=>x.id===cid),st=STEP[to];
  const g=k=>{const el=document.getElementById('fx-'+k);return el?el.value.trim():'';};
  for(const f of st.fields){if(f[3]&&!g(f[0])){document.getElementById('aErr').textContent='Completa: '+f[1]+'.';return;}}
  if(to==='retiro'){c.number=g('num').toUpperCase();c.driver=g('drv');c.plate=g('plt').toUpperCase();c.ramp='ESPERA_RAMPA';c.rampa=null;}
  if(to==='bodega'){c.seal=g('seal');c.loaded=parseInt(g('box'),10)||null;log('Bodega selló '+c.number+' en '+c.rampa+' y lo pasó al buffer');c.ramp=null;c.rampa=null;}
  const fi=document.getElementById('fx-file');
  if(st.proof){const file=fi&&fi.files&&fi.files[0];const name=file?file.name:(st.proof.replace(/\W+/g,'_')+'_'+(c.number||c.seq).toString().replace(/\W/g,'')+'.pdf');if(file){FILES.put(b.id+'/'+c.id+'/'+name,file).catch(()=>{});}c.proofs.push({type:st.proof,name:name,by:OWNER[to]});}
  c.status=to;
  log((to==='bodega'?'Bodega':CN[c.carrierId])+' marcó '+st.t.toLowerCase()+' · '+b.ref+' #'+c.seq+(c.number?' ('+c.number+')':''));
  closeModal();commit();toast(st.t+' registrado. '+(to==='retiro'?'Ya aparece en la cola de rampas de bodega.':'El cliente ya lo ve.'));
}

/* ===== modal / toast ===== */
let lastFocus=null;
function openModal(html,narrow){const ov=document.getElementById('ov'),sh=document.getElementById('sheet');lastFocus=document.activeElement;sh.className='sheet'+(narrow?' narrow':'');sh.innerHTML=html;ov.hidden=false;const f=sh.querySelector('input,select,textarea,button.btn');if(f)f.focus();}
function closeModal(){document.getElementById('ov').hidden=true;document.getElementById('sheet').innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
function toast(t,bad){const el=document.createElement('div');el.className='toast show '+(bad?'bad':'ok');el.textContent=t;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),4200);}

/* ===== render ===== */
let expSeen=new Set();
function render(){
  const lg=document.getElementById('vlogin');
  lg.hidden=!!ui.auth;
  if(!ui.auth){document.getElementById('lg-demo').innerHTML=Object.keys(USERS).map(u=>'<button type="button" class="hdr-logout" data-act="demo" data-u="'+u+'">'+u+'</button>').join('');return;}
  if(!(SECTIONS[ui.role]||[]).some(x=>x[0]===ui.sec))ui.sec='main';
  renderRoles();
  const v=document.getElementById('view');
  const sy=window.scrollY;
  v.innerHTML=ui.sec==='rampas'?vRampas():ui.role==='cliente'?vCliente():ui.role==='bodega'?vBodega():ui.role==='transportista'?vTrans():vAdmin();
  window.scrollTo(0,sy);
  tickClocks();
}
function commit(){save();render();const ov=document.getElementById('ov');if(!ov.hidden&&ov.dataset.detail){detail(ov.dataset.detail);}}
function checkExpiry(){
  let changed=false;
  state.bookings.forEach(b=>{if(expired(b)&&!expSeen.has(b.id)){expSeen.add(b.id);if(!b.expLogged){b.expLogged=true;log('Alerta: '+b.ref+' venció sin confirmación ('+openCount(b)+' sin cubrir)');changed=true;}if(ui.role==='admin')toast('Alerta: '+b.ref+' venció sin confirmación de transportista.',true);}
    if(!expired(b)&&expSeen.has(b.id))expSeen.delete(b.id);});
  if(changed){save();}
  render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(e.target.id==='ov'){closeModal();document.getElementById('ov').dataset.detail='';return;}
  if(!t)return;
  const a=t.dataset.act, ov=document.getElementById('ov');
  if(['carrier','pref','fix','reassign'].indexOf(a)>=0)return;
  switch(a){
   case 'sec':closeModal();ui.sec=t.dataset.k;save();render();window.scrollTo(0,0);break;
   case 'demo':document.getElementById('lg-user').value=t.dataset.u;document.getElementById('lg-pass').value='demo';document.getElementById('lg-pass').focus();break;
   case 'logout':closeModal();document.getElementById('toasts').innerHTML='';ui.auth=false;ui.user='';save();render();break;
   case 'rtap':ov.dataset.detail='';rampModal(t.dataset.b,t.dataset.c);break;
   case 'rfree':ov.dataset.detail='';freeModal(t.dataset.r);break;
   case 'toRamp':{const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c),r=t.dataset.r;
     if(rampOcc(r)){toast('La rampa '+r+' ya está ocupada.',true);break;}
     c.rampa=r;c.ramp='PEND_INSP';log('Bodega asignó '+c.number+' ('+b.ref+') a '+r);closeModal();commit();toast(c.number+' asignado a '+r+'. Pendiente de inspección.');break;}
   case 'rstep':{const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c),to=t.dataset.to;
     if(to==='ESPERA_RAMPA')c.rampa=null;
     c.ramp=to;log('Bodega: '+c.number+' → '+RST[to].l.toLowerCase());closeModal();commit();toast(c.number+': '+RST[to].l+'.');break;}
   case 'seal':advForm(t.dataset.b,t.dataset.c,'bodega');break;
   case 'doc':downloadDoc(t.dataset.k,t.dataset.n,t.dataset.r);break;
   case 'new':ov.dataset.detail='';newBooking();break;
   case 'addsku':addSku();break;
   case 'rmsku':t.parentElement.remove();break;
   case 'submitNew':submitNew();break;
   case 'close':ov.dataset.detail='';closeModal();break;
   case 'detail':ov.dataset.detail=t.dataset.id;detail(t.dataset.id);break;
   case 'confirm':ov.dataset.detail='';confirmForm(t.dataset.id);break;
   case 'sendConfirm':sendConfirm(t.dataset.id);break;
   case 'decline':{const b=B(t.dataset.id);
     if(b.mode==='directo'){b.mode='abierto';b.directTo=null;b.publishedAt=Date.now();b.expLogged=false;log(CN[ui.carrier]+' rechazó '+b.ref+' · pasó a modo abierto, reloj reiniciado');toast('Rechazado. El booking se abrió a los demás transportistas.');}
     else{b.hidden.push(ui.carrier);log(CN[ui.carrier]+' indicó que no puede cubrir '+b.ref);toast('Listo, ya no verás este booking.');}
     commit();break;}
   case 'approve':case 'reject':{const f=state.confs.find(x=>x.id===t.dataset.id),b=B(f.bookingId);
     b.containers.filter(c=>c.confId===f.id&&c.status==='confirmado').forEach(c=>{if(a==='approve')c.status='asignado';else{c.status='publicado';c.carrierId=null;c.confId=null;}});
     f.status=a==='approve'?'aprobada':'rechazada';
     log('DP World '+(a==='approve'?'aprobó':'rechazó')+' '+f.qty+' cont. de '+b.ref+' para '+CN[f.carrierId]);
     commit();toast(a==='approve'?'Aprobado. '+CN[f.carrierId]+' ya puede operar.':'Rechazado. Los contenedores vuelven a publicarse.',a!=='approve');break;}
   case 'force':{const b=B(t.dataset.id),cid=document.getElementById('asg-'+b.id).value,n=openCount(b);
     b.containers.filter(c=>c.status==='publicado').forEach(c=>{c.status='asignado';c.carrierId=cid;});
     log('DP World asignó directo '+n+' cont. de '+b.ref+' a '+CN[cid]);commit();toast(n+' contenedores asignados a '+CN[cid]+'.');break;}
   case 'reopen':{const b=B(t.dataset.id);b.mode='abierto';b.directTo=null;b.publishedAt=Date.now();b.hidden=[];b.expLogged=false;log('DP World reabrió '+b.ref+' a todos · nuevo plazo de 1 h');commit();toast('Reabierto a todos los transportistas por 1 h.');break;}
   case 'mode':state.settings.mode=t.dataset.v;log('Modo de publicación: '+(t.dataset.v==='directo'?'directo a preferido':'abierto'));commit();break;
   case 'adv':ov.dataset.detail='';advForm(t.dataset.b,t.dataset.c,t.dataset.to);break;
   case 'load':ov.dataset.detail='';advForm(t.dataset.b,t.dataset.c,'bodega');break;
   case 'doAdv':doAdv(t.dataset.b,t.dataset.c,t.dataset.to);break;
   case 'bulk':{const b=B(t.dataset.b),to=t.dataset.to;const cs=b.containers.filter(c=>c.carrierId===ui.carrier&&c.status===t.dataset.from);
     cs.forEach(c=>{c.status=to;if(STEP[to].proof)c.proofs.push({type:STEP[to].proof,name:STEP[to].proof.replace(/\W+/g,'_')+'_'+c.number.replace(/\W/g,'')+'.pdf',by:'transportista'});});
     log(CN[ui.carrier]+' marcó '+cs.length+' cont. de '+b.ref+' como '+LBL[to].toLowerCase());commit();toast(cs.length+' contenedores actualizados a «'+LBL[to]+'».');break;}
   case 'reset':state=seed();FILES.clear().catch(()=>{});expSeen=new Set();save();closeModal();render();toast('Demo reiniciada con datos de ejemplo.');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target, a=t.dataset&&t.dataset.act;
  if(a==='carrier'){ui.carrier=t.value;save();render();}
  else if(a==='pref'){state.settings.preferred=t.value;log('Proveedor preferido: '+CN[t.value]);commit();}
  else if(a==='fix'){const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c);const old=c.status;c.status=t.value;
    if(IDX[t.value]===0){c.carrierId=null;c.confId=null;}
    if(IDX[t.value]>=IDX.retiro&&!c.number){c.number=cnum(b.naviera);}
    if(IDX[t.value]>=IDX.asignado&&!c.carrierId){c.carrierId=b.directTo||state.settings.preferred;}
    c.rampa=null;c.ramp=t.value==='retiro'?'ESPERA_RAMPA':null;
    log('DP World corrigió '+b.ref+' #'+c.seq+': '+LBL[old]+' → '+LBL[t.value]);commit();toast('Estado corregido.');}
  else if(a==='reassign'){const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c);
    if(!t.value){c.carrierId=null;c.status='publicado';c.confId=null;}else{c.carrierId=t.value;c.confId=null;if(IDX[c.status]<2)c.status='asignado';}
    log('DP World asignó '+b.ref+' #'+c.seq+' a '+(CN[t.value]||'nadie'));commit();toast('Contenedor reasignado.');}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.bkr')){if(d.open)ui.open[d.dataset.key]=1;else delete ui.open[d.dataset.key];save();}},true);
document.getElementById('lgForm').addEventListener('submit',e=>{
  e.preventDefault();
  const u=document.getElementById('lg-user').value.trim().toLowerCase(),pw=document.getElementById('lg-pass').value,err=document.getElementById('lg-err'),usr=USERS[u];
  if(!usr||pw!=='demo'){err.classList.add('show');return;}
  err.classList.remove('show');
  Object.assign(ui,{auth:true,user:u,role:usr.role,carrier:usr.carrier||ui.carrier,sec:'main'});
  document.getElementById('lg-pass').value='';save();render();window.scrollTo(0,0);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return;}if(e.key==='Escape'&&!document.getElementById('ov').hidden){document.getElementById('ov').dataset.detail='';closeModal();}});

load();
state.bookings.forEach(b=>{if(expired(b))expSeen.add(b.id);});
render();
setInterval(tickClocks,1000);
setInterval(checkExpiry,20000);
})();
</script>
</body>
</html>
