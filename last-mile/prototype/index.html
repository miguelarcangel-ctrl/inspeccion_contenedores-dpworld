<title>DP World Last Mile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: cabecera blanca con logo a color y filete degradado rojo→verde→grafito; vistas en tarjetas suaves con mucho aire */
:root{
  --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F1F1F4; --ink:#0F0F19; --muted:#6B6B78; --line:#E7E7EC;
  --header:#FFFFFF; --header-ink:#0F0F19;
  --graphite:#0F0F19; --on-graphite:#FFFFFF;
  --green:#00B36D; --green-bright:#00E68C; --green-soft:#E3FBF1;
  --red:#D7194C; --red-bright:#FF2261; --red-soft:#FFEAF0;
  --g-green:linear-gradient(120deg,#00E68C 0%,#7EF2C4 100%);
  --g-red:linear-gradient(120deg,#D7194C 0%,#FF2261 45%,#FFA3BE 100%);
  --g-graphite:linear-gradient(120deg,#0F0F19 0%,#4A4A56 70%,#9A9AA4 100%);
  --g-brand:linear-gradient(90deg,#D7194C 0%,#FF2261 18%,#FFA3BE 34%,#7EF2C4 52%,#00E68C 66%,#4A4A56 84%,#0F0F19 100%);
  --seg-0:#FF2261; --seg-1:#FFA3BE; --seg-2:#D4D4DB; --seg-3:#A3A3AD; --seg-4:#62626E; --seg-5:#0F0F19; --seg-6:#00E68C; --seg-7:#00B36D;
  --shadow:0 1px 2px rgba(15,15,25,.04),0 6px 24px rgba(15,15,25,.06);
  --logo-l:block; --logo-d:none;
  --f-display:'Sora','Segoe UI',Arial,sans-serif;
  --f-body:'Manrope','Segoe UI',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B12; --surface:#15151F; --surface-2:#1D1D29; --ink:#F1F1F5; --muted:#9C9CAB; --line:#272734;
  --header:#0F0F19; --header-ink:#FFFFFF;
  --graphite:#F1F1F5; --on-graphite:#0F0F19;
  --green:#2CEB9C; --green-bright:#00E68C; --green-soft:#0F2E22;
  --red:#FF5C86; --red-bright:#FF2261; --red-soft:#33141F;
  --g-graphite:linear-gradient(120deg,#F1F1F5 0%,#A3A3AD 100%);
  --seg-2:#3A3A47; --seg-3:#5C5C6A; --seg-4:#8A8A98; --seg-5:#D4D4DB;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --logo-l:none; --logo-d:block; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0B12; --surface:#15151F; --surface-2:#1D1D29; --ink:#F1F1F5; --muted:#9C9CAB; --line:#272734;
  --header:#0F0F19; --header-ink:#FFFFFF;
  --graphite:#F1F1F5; --on-graphite:#0F0F19;
  --green:#2CEB9C; --green-bright:#00E68C; --green-soft:#0F2E22;
  --red:#FF5C86; --red-bright:#FF2261; --red-soft:#33141F;
  --g-graphite:linear-gradient(120deg,#F1F1F5 0%,#A3A3AD 100%);
  --seg-2:#3A3A47; --seg-3:#5C5C6A; --seg-4:#8A8A98; --seg-5:#D4D4DB;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --logo-l:none; --logo-d:block; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}

/* header */
.top{background:var(--header);color:var(--header-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.top::after{content:"";display:block;height:3px;background:var(--g-brand)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.brand .logo{height:40px;width:auto;flex:none}
.brand .logo-l{display:var(--logo-l)} .brand .logo-d{display:var(--logo-d)}
.divider{width:1px;height:30px;background:var(--line);flex:none}
.wm{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;line-height:1}
.appn{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px;font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:2px;background:var(--surface-2);padding:4px;border-radius:999px}
.role{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.role:hover{color:var(--ink)}
.role[aria-selected="true"]{background:var(--graphite);color:var(--on-graphite)}
.role:focus-visible{outline:2px solid var(--green-bright);outline-offset:2px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red-bright);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}

/* flow strip */
.flow{background:transparent}
.flow ol{list-style:none;margin:0 auto;padding:14px 0 0;display:flex;gap:4px;overflow-x:auto;max-width:1160px}
.flow li{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12.5px;color:var(--muted);padding:5px 10px 5px 6px;border-radius:999px}
.flow li b{font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.flow li.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.flow li.on b{background:var(--g-green);color:#0F0F19;box-shadow:none}

main{padding-block:26px 64px}
.view{display:grid;gap:30px}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.vhead h1{font-size:28px;line-height:1.15;letter-spacing:-.01em}
.vhead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:16px;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.count{font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:1px 9px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:16px 18px;display:grid;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:18px;bottom:0;width:32px;height:3px;border-radius:3px 3px 0 0;background:var(--g-graphite)}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi.warn::after,.kpi.crit::after{background:var(--g-red)} .kpi.ok::after{background:var(--g-green)}
.kpi.crit .v{color:var(--red)} .kpi.ok .v{color:var(--green)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green-bright);outline-offset:1px}
.btn.pri{background:var(--graphite);border-color:transparent;color:var(--on-graphite)}
.btn.go{background:var(--g-green);border-color:transparent;color:#0F0F19}
.btn.no{color:var(--red);border-color:transparent;background:var(--red-soft)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:var(--green-bright);text-decoration-thickness:2px;text-underline-offset:4px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-amber{background:var(--red-soft);color:var(--red)}
.p-red{background:var(--red-bright);color:#fff}
.p-red::before{background:#fff}
.p-blue{background:var(--surface-2);color:var(--ink)}
.p-green{background:var(--green-soft);color:var(--green)}
.p-grey{background:var(--surface-2);color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;color:var(--muted);background:var(--surface-2)}
.tag.size{color:var(--on-graphite);background:var(--graphite);font-family:var(--f-mono);font-size:12.5px;padding:3px 10px}

/* booking cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:16px}
.bk{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:grid;overflow:hidden;min-width:0}
.bk.alert{box-shadow:var(--shadow),inset 0 3px 0 var(--red-bright)}
.win{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 0}
.win>div{display:grid;gap:2px;min-width:0;padding-left:12px;position:relative}
.win>div::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:3px;background:var(--g-graphite)}
.win>div+div::before{background:var(--g-green)}
.win .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.win .loc{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bk-main{padding:14px 18px 16px;display:grid;gap:12px}
.bk-id{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.bk-ref{font-family:var(--f-mono);font-weight:600;font-size:18px}
.bk-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.bk-meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
.bk-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* progress */
.bar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:2px}
.bar span{height:100%;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}

/* clock */
.clock{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:13px}
.clock svg{width:15px;height:15px}
.clock.warn{background:var(--red-soft);color:var(--red)}
.clock.over{background:var(--red-bright);color:#fff}

/* cargo */
.cargo{border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--green-soft)}
.cargo ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.cargo li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.cargo .sku{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--surface);padding:1px 7px;border-radius:6px}
.note{padding:10px 12px;background:var(--surface);border-radius:10px;font-size:13.5px}
.lock{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* tables */
.tw{overflow-x:auto;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.bk .tw,.sheet .tw,.panel .tw{box-shadow:none;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
.t th{background:transparent;color:var(--muted);text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;padding:12px 12px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.t tr:first-child td{border-top:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t td.r{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);font-weight:600;white-space:nowrap}

.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.empty{padding:22px;border-radius:14px;color:var(--muted);text-align:center;font-size:14px;background:var(--surface);border:1px dashed var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--graphite);color:var(--on-graphite)}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px}
.log{display:grid;font-size:13.5px}
.log div{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,15,25,.45);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:min(880px,100%);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.sheet.narrow{width:min(520px,100%)}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line)}
.sh-h h3{font-size:19px}
.sh-b{padding:18px 20px;display:grid;gap:16px}
.sh-b .bk{box-shadow:none;border:1px solid var(--line)}
.sh-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1;flex:none;color:var(--ink)}
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.f{display:grid;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}
fieldset{border:0;border-radius:14px;padding:14px;margin:0;display:grid;gap:12px;min-width:0;background:var(--surface-2)}
legend{font-family:var(--f-display);font-weight:600;padding:0;font-size:14px;float:left;width:100%;margin-bottom:2px}
fieldset.wh{background:var(--green-soft)}
.skurow{display:grid;grid-template-columns:110px 1fr 90px 32px;gap:6px;align-items:center}
@media (max-width:520px){.skurow{grid-template-columns:1fr 1fr}.skurow .d{grid-column:1/-1}}
.info{font-size:13.5px;padding:10px 14px;border-radius:12px;background:var(--surface-2)}
.err{color:var(--red);font-size:13px;font-weight:700}
.docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.doc{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);display:inline-flex;gap:5px;align-items:center;color:var(--ink);text-decoration:none}

#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(380px,calc(100vw - 32px))}
.toast{background:#0F0F19;color:#fff;padding:12px 16px 12px 18px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:in .25s ease-out;position:relative;overflow:hidden}
.toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#00E68C,#7EF2C4)}
.toast.bad::before{background:linear-gradient(180deg,#FF2261,#FFA3BE)}
@keyframes in{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn{transition:none}}
footer{padding-block:22px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
@media (max-width:560px){.vhead h1{font-size:23px}.win{grid-template-columns:1fr}.role{padding:6px 10px;font-size:12.5px}.brand .logo{height:34px}}
</style>

/* derived */
const B=id=>state.bookings.find(x=>x.id===id);
const deadline=b=>b.publishedAt+HOUR;
const openCount=b=>b.containers.filter(c=>c.status==='publicado').length;
const expired=b=>openCount(b)>0&&Date.now()>deadline(b);
function counts(b){const o={};ST.forEach(s=>o[s.k]=0);b.containers.forEach(c=>o[c.status]++);return o;}
function minIdx(b){return Math.min.apply(null,b.containers.map(c=>IDX[c.status]));}
function stagePill(b,role){
  const ct=counts(b);
  if(ct.devuelto===b.containers.length) return '<span class="pill p-green">Completado</span>';
  if(role==='cliente'){
    if(ct.publicado+ct.confirmado>0) return '<span class="pill p-amber">Programando transporte</span>';
    const k=ST[minIdx(b)].k; return '<span class="pill '+(IDX[k]>=IDX.entregado?'p-green':'p-blue')+'">'+(k==='asignado'?'Transporte asignado':LBL[k])+'</span>';}
  if(expired(b)) return '<span class="pill p-red">Vencido sin cubrir</span>';
  if(ct.publicado>0) return '<span class="pill p-amber">Publicado · '+ct.publicado+' sin cubrir</span>';
  if(ct.confirmado>0) return '<span class="pill p-blue">Por aprobar</span>';
  const k=ST[minIdx(b)].k; return '<span class="pill '+(IDX[k]>=IDX.entregado?'p-green':'p-blue')+'">'+LBL[k]+'</span>';
}
function bar(b){
  const ct=counts(b),n=b.containers.length;
  return '<div class="bar" role="img" aria-label="Avance por estado">'+ST.map((s,i)=>ct[s.k]?'<span style="width:'+(ct[s.k]/n*100)+'%;background:var(--seg-'+i+')" title="'+esc(s.l)+': '+ct[s.k]+'"></span>':'').join('')+'</div>'+
   '<div class="legend">'+ST.map((s,i)=>ct[s.k]?'<span><i style="background:var(--seg-'+i+')"></i>'+esc(s.l)+' <b class="num">'+ct[s.k]+'</b></span>':'').join('')+'</div>';
}
const clockSvg='<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5V8l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function tickClocks(){
  document.querySelectorAll('[data-dl]').forEach(el=>{
    const left=+el.dataset.dl-Date.now(), s=el.querySelector('span');
    el.classList.toggle('warn',left>0&&left<15*MIN); el.classList.toggle('over',left<=0);

/* attention badges */
function attention(){
  const a={cliente:0,bodega:0,transportista:0,admin:0};
  state.bookings.forEach(b=>{
    b.containers.forEach(c=>{if(c.status==='retiro')a.bodega++;});
    if(openCount(b)&&!expired(b)&&(b.mode==='abierto'||b.directTo===ui.carrier)&&b.hidden.indexOf(ui.carrier)<0)a.transportista++;
    if(expired(b))a.admin++;});
  a.admin+=state.confs.filter(f=>f.status==='pendiente').length;
  return a;
}

function doAdv(bid,cid,to){
  const b=B(bid),c=b.containers.find(x=>x.id===cid),st=STEP[to];
  const g=k=>{const el=document.getElementById('fx-'+k);return el?el.value.trim():'';};

  if(to==='retiro'){c.number=g('num').toUpperCase();c.driver=g('drv');c.plate=g('plt').toUpperCase();}
  if(to==='bodega'){c.seal=g('seal');c.loaded=parseInt(g('box'),10)||null;}
  const fi=document.getElementById('fx-file');
  if(st.proof){const file=fi&&fi.files&&fi.files[0];const name=file?file.name:(st.proof.replace(/\W+/g,'_')+'_'+(c.number||c.seq).toString().replace(/\W/g,'')+'.pdf');if(file){try{objUrls[name]=URL.createObjectURL(file);}catch(e){}}c.proofs.push({type:st.proof,name:name,by:OWNER[to]});}
  c.status=to;
  log((to==='bodega'?'Bodega':CN[c.carrierId])+' marcó '+st.t.toLowerCase()+' · '+b.ref+' #'+c.seq+(c.number?' ('+c.number+')':''));

}

let lastFocus=null;
function openModal(html,narrow){const ov=document.getElementById('ov'),sh=document.getElementById('sheet');lastFocus=document.activeElement;sh.className='sheet'+(narrow?' narrow':'');sh.innerHTML=html;ov.hidden=false;const f=sh.querySelector('input,select,textarea,button.btn');if(f)f.focus();}
function closeModal(){document.getElementById('ov').hidden=true;document.getElementById('sheet').innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}

/* ===== render ===== */
let expSeen=new Set();
function render(){
  renderRoles();
  const v=document.getElementById('view');
  const sy=window.scrollY;
  v.innerHTML=ui.role==='cliente'?vCliente():ui.role==='bodega'?vBodega():ui.role==='transportista'?vTrans():vAdmin();
  window.scrollTo(0,sy);
  tickClocks();
  const ov=document.getElementById('ov');
  if(!ov.hidden){const d=document.querySelector('#sheet [data-detail]');}
}
function commit(){save();render();const ov=document.getElementById('ov');if(!ov.hidden&&ov.dataset.detail){detail(ov.dataset.detail);}}
function checkExpiry(){
  let changed=false;
  state.bookings.forEach(b=>{if(expired(b)&&!expSeen.has(b.id)){expSeen.add(b.id);if(!b.expLogged){b.expLogged=true;log('Alerta: '+b.ref+' venció sin confirmación ('+openCount(b)+' sin cubrir)');changed=true;}if(ui.role==='admin')toast('Alerta: '+b.ref+' venció sin confirmación de transportista.',true);}
    if(!expired(b)&&expSeen.has(b.id))expSeen.delete(b.id);});
  if(changed){save();}
  render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(e.target.id==='ov'){closeModal();document.getElementById('ov').dataset.detail='';return;}
  if(!t)return;
  const a=t.dataset.act, ov=document.getElementById('ov');
  if(['carrier','pref','fix','reassign'].indexOf(a)>=0)return;
  switch(a){
   case 'role':ui.role=t.dataset.k;save();render();window.scrollTo(0,0);break;
   case 'new':ov.dataset.detail='';newBooking();break;
   case 'addsku':addSku();break;
   case 'rmsku':t.parentElement.remove();break;
   case 'submitNew':submitNew();break;
   case 'close':ov.dataset.detail='';closeModal();break;
   case 'detail':ov.dataset.detail=t.dataset.id;detail(t.dataset.id);break;
   case 'confirm':ov.dataset.detail='';confirmForm(t.dataset.id);break;
   case 'sendConfirm':sendConfirm(t.dataset.id);break;
   case 'decline':{const b=B(t.dataset.id);
     if(b.mode==='directo'){b.mode='abierto';b.directTo=null;b.publishedAt=Date.now();b.expLogged=false;log(CN[ui.carrier]+' rechazó '+b.ref+' · pasó a modo abierto, reloj reiniciado');toast('Rechazado. El booking se abrió a los demás transportistas.');}
     else{b.hidden.push(ui.carrier);log(CN[ui.carrier]+' indicó que no puede cubrir '+b.ref);toast('Listo, ya no verás este booking.');}
     commit();break;}
   case 'approve':case 'reject':{const f=state.confs.find(x=>x.id===t.dataset.id),b=B(f.bookingId);
     b.containers.filter(c=>c.confId===f.id&&c.status==='confirmado').forEach(c=>{if(a==='approve')c.status='asignado';else{c.status='publicado';c.carrierId=null;c.confId=null;}});
     f.status=a==='approve'?'aprobada':'rechazada';
     log('DP World '+(a==='approve'?'aprobó':'rechazó')+' '+f.qty+' cont. de '+b.ref+' para '+CN[f.carrierId]);
     commit();toast(a==='approve'?'Aprobado. '+CN[f.carrierId]+' ya puede operar.':'Rechazado. Los contenedores vuelven a publicarse.',a!=='approve');break;}
   case 'force':{const b=B(t.dataset.id),cid=document.getElementById('asg-'+b.id).value,n=openCount(b);
     b.containers.filter(c=>c.status==='publicado').forEach(c=>{c.status='asignado';c.carrierId=cid;});
     log('DP World asignó directo '+n+' cont. de '+b.ref+' a '+CN[cid]);commit();toast(n+' contenedores asignados a '+CN[cid]+'.');break;}
   case 'reopen':{const b=B(t.dataset.id);b.mode='abierto';b.directTo=null;b.publishedAt=Date.now();b.hidden=[];b.expLogged=false;log('DP World reabrió '+b.ref+' a todos · nuevo plazo de 1 h');commit();toast('Reabierto a todos los transportistas por 1 h.');break;}
   case 'mode':state.settings.mode=t.dataset.v;log('Modo de publicación: '+(t.dataset.v==='directo'?'directo a preferido':'abierto'));commit();break;
   case 'adv':ov.dataset.detail='';advForm(t.dataset.b,t.dataset.c,t.dataset.to);break;
   case 'load':ov.dataset.detail='';advForm(t.dataset.b,t.dataset.c,'bodega');break;
   case 'doAdv':doAdv(t.dataset.b,t.dataset.c,t.dataset.to);break;
   case 'bulk':{const b=B(t.dataset.b),to=t.dataset.to;const cs=b.containers.filter(c=>c.carrierId===ui.carrier&&c.status===t.dataset.from);
     cs.forEach(c=>{c.status=to;if(STEP[to].proof)c.proofs.push({type:STEP[to].proof,name:STEP[to].proof.replace(/\W+/g,'_')+'_'+c.number.replace(/\W/g,'')+'.pdf',by:'transportista'});});
     log(CN[ui.carrier]+' marcó '+cs.length+' cont. de '+b.ref+' como '+LBL[to].toLowerCase());commit();toast(cs.length+' contenedores actualizados a «'+LBL[to]+'».');break;}
   case 'reset':state=seed();objUrls={};expSeen=new Set();save();closeModal();render();toast('Demo reiniciada con datos de ejemplo.');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target, a=t.dataset&&t.dataset.act;
  if(a==='carrier'){ui.carrier=t.value;save();render();}
  else if(a==='pref'){state.settings.preferred=t.value;log('Proveedor preferido: '+CN[t.value]);commit();}
  else if(a==='fix'){const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c);const old=c.status;c.status=t.value;
    if(IDX[t.value]===0){c.carrierId=null;c.confId=null;}
    if(IDX[t.value]>=IDX.retiro&&!c.number){c.number=cnum(b.naviera);}
    if(IDX[t.value]>=IDX.asignado&&!c.carrierId){c.carrierId=b.directTo||state.settings.preferred;}
    log('DP World corrigió '+b.ref+' #'+c.seq+': '+LBL[old]+' → '+LBL[t.value]);commit();toast('Estado corregido.');}
  else if(a==='reassign'){const b=B(t.dataset.b),c=b.containers.find(x=>x.id===t.dataset.c);
    if(!t.value){c.carrierId=null;c.status='publicado';c.confId=null;}else{c.carrierId=t.value;c.confId=null;if(IDX[c.status]<2)c.status='asignado';}
    log('DP World asignó '+b.ref+' #'+c.seq+' a '+(CN[t.value]||'nadie'));commit();toast('Contenedor reasignado.');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('ov').hidden){document.getElementById('ov').dataset.detail='';closeModal();}});

load();
state.bookings.forEach(b=>{if(expired(b))expSeen.add(b.id);});
render();
setInterval(tickClocks,1000);
setInterval(checkExpiry,20000);
})();
</script>
