<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control de Rampas — DP World Panamá</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d0b28; --surf:#16143d; --card:#1e1c50; --raised:#252368;
  --b0:rgba(255,255,255,.05); --b1:rgba(255,255,255,.1); --b2:rgba(255,255,255,.18); --b3:rgba(255,255,255,.28);
  --t:#fff; --t2:rgba(255,255,255,.6); --t3:rgba(255,255,255,.3); --t4:rgba(255,255,255,.12);
  --primary:#3E3C90; --primary-dk:#2D2B6B;
  --green:#00C389; --gg:rgba(0,195,137,.5); --gd:#00a372;
  --blue:#0099e6; --bg2:rgba(0,153,230,.5);
  --amber:#f5a20b; --ag:rgba(245,162,11,.4);
  --red:#E8003D; --rg:rgba(232,0,61,.5);
  --orange:#ff6830;
  --r:10px; --r2:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
.view{display:none}.view.active{display:block}

/* ── ICONS ── */
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── LOGIN ── */
.lgbg{min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(0,195,137,.1) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(62,60,144,.2) 0%,transparent 60%),linear-gradient(160deg,#0d0b28 0%,#16143d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.lg-hero{text-align:center;margin-bottom:30px}
.globe-ring{width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:rgba(0,195,137,.07);border:1.5px solid rgba(0,195,137,.2);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,195,137,.12)}
.lg-brand{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#fff;letter-spacing:2px}
.lg-sub{font-size:10px;color:var(--green);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-top:5px}
.lg-card{background:rgba(17,16,58,.9);border:1px solid var(--b2);border-radius:16px;padding:26px 22px;width:100%;max-width:360px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lg-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--t2);margin-bottom:16px;text-align:center;letter-spacing:.5px}
.role-row{display:flex;gap:8px;margin-bottom:18px}
.role-btn{flex:1;padding:12px 6px;border-radius:8px;border:1.5px solid var(--b1);background:var(--b0);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--t3);cursor:pointer;transition:all .2s;text-align:center;letter-spacing:.5px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.role-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,195,137,.08);box-shadow:0 0 12px rgba(0,195,137,.2)}
.role-ic{display:block;margin-bottom:4px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.flbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.fin{border:1.5px solid var(--b1);border-radius:7px;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--t);background:rgba(255,255,255,.04);width:100%;transition:border-color .2s}
.fin:focus{outline:none;border-color:var(--green);background:rgba(0,195,137,.04)}
.btn-lg{width:100%;background:var(--green);color:#0d0b28;border:none;border-radius:8px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:1px;transition:all .2s;margin-top:8px;box-shadow:0 4px 20px rgba(0,195,137,.4);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.btn-lg:hover{box-shadow:0 6px 28px rgba(0,195,137,.4);transform:translateY(-1px)}
.lg-err{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);color:#ff8888;border-radius:7px;padding:8px 12px;font-size:12px;margin-bottom:10px;display:none}

/* ── APP HEADER ── */
.ahdr{background:linear-gradient(90deg,var(--primary-dk) 0%,var(--primary) 100%);border-bottom:1px solid var(--b1);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:50px;position:sticky;top:0;z-index:90;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.ahdr-l{display:flex;align-items:center;gap:10px}
.ahdr-logo{width:28px;height:28px;flex-shrink:0}
.ahdr-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1}
.ahdr-sub{font-size:9px;color:var(--green);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.ahdr-r{display:flex;align-items:center;gap:7px}
.upill{background:rgba(0,195,137,.12);border:1px solid rgba(0,195,137,.25);color:var(--green);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px}
.btn-out{background:var(--b0);border:1px solid var(--b1);color:var(--t3);padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
.btn-out:hover{color:var(--t);border-color:var(--b2)}

/* ── STATS ── */
.stats{display:flex;background:rgba(13,10,46,.8);border-bottom:1px solid var(--b0)}
.sbox{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--b0)}
.sbox:last-child{border-right:none}
.sn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1}
.sn.sl{color:rgba(255,255,255,.2)} .sn.en{color:var(--blue)} .sn.sa{color:var(--amber)} .sn.ok{color:var(--green)} .sn.bf{color:var(--orange)}
.sl2{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);margin-top:1px}

/* ── TABS ── */
.btabs{display:flex;padding:8px 14px 6px;gap:6px;background:var(--bg)}
.btab{flex:1;padding:8px 4px;border-radius:6px;border:1px solid var(--b1);background:var(--b0);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--t3);cursor:pointer;transition:all .2s;text-align:center;letter-spacing:.3px}
.btab.active{border-color:var(--primary);background:rgba(62,60,144,.2);color:#fff;box-shadow:0 0 10px rgba(62,60,144,.3)}

/* ── DOCK SCENE ── */
.dock-wrap{padding:0 12px 10px;position:relative}
.dock-scene{position:relative}

/* Move mode overlay banner */
.move-banner{background:linear-gradient(90deg,rgba(0,195,137,.15) 0%,rgba(0,195,137,.08) 100%);border:1px solid rgba(0,195,137,.3);border-radius:8px;padding:8px 12px;margin:0 12px 8px;display:none;align-items:center;justify-content:space-between}
.move-banner.active{display:flex}
.move-banner-txt{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px}
.move-banner-cancel{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.3);color:#ff8888;padding:5px 12px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.3px}

/* Wall */
.wh-wall{background:linear-gradient(180deg,#151050 0%,#0d0a2e 100%);border-radius:6px 6px 0 0;border:1px solid rgba(255,255,255,.08);border-bottom:3px solid var(--green);display:flex;align-items:flex-end;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wh-wall::-webkit-scrollbar{display:none}
.wh-inner{display:flex;padding:6px 10px 0;gap:8px;min-width:max-content}
.wh-bodlbl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2.5px;color:rgba(0,195,137,.35);text-transform:uppercase;padding:0 6px 8px;align-self:flex-start;white-space:nowrap;flex-shrink:0}
.rdoor{width:36px;flex-shrink:0;text-align:center}
.dframe{background:#080520;border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:3px 3px 0 0;height:28px;position:relative;display:flex;align-items:center;justify-content:center}
/* Dock bumpers */
.dframe::before,.dframe::after{content:'';position:absolute;bottom:0;width:5px;height:13px;background:repeating-linear-gradient(0deg,var(--amber) 0px,var(--amber) 4px,#0a0820 4px,#0a0820 7px);border-radius:1px 1px 0 0}
.dframe::before{left:2px} .dframe::after{right:2px}
/* Dock seal strip */
.dseal{width:100%;height:3px;background:repeating-linear-gradient(90deg,rgba(0,195,137,.3) 0px,rgba(0,195,137,.3) 2px,transparent 2px,transparent 5px);position:absolute;bottom:0}
.dnum{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:.5px}

/* Ramp scroll */
.rscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#0d0a2e 0%,#0a0820 100%);border-left:1px solid var(--b1);border-right:1px solid var(--b1)}
.rscroll::-webkit-scrollbar{display:none}
.rinner{display:flex;padding:6px 10px 4px;gap:8px;min-width:max-content;align-items:flex-end}
.rslot{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.rpipe{width:2px;height:10px;background:linear-gradient(180deg,rgba(0,195,137,.4) 0%,rgba(0,195,137,.05) 100%);margin:0 auto 3px}

/* ── CONTAINER BOX ── */
.cbox{width:36px;height:148px;background:linear-gradient(180deg,#0e0b28 0%,#0a0820 100%);border:2px solid rgba(255,255,255,.12);border-radius:3px;position:relative;overflow:hidden;cursor:pointer;transition:all .25s;flex-shrink:0}
.cbox:hover{transform:translateY(-2px)}
/* Corrugation texture */
.cbox::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 5px,rgba(255,255,255,.025) 5px,rgba(255,255,255,.025) 6px);pointer-events:none;z-index:2}
/* Fill level */
.cfill{position:absolute;bottom:0;left:0;right:0;transition:height .7s cubic-bezier(.4,0,.2,1);z-index:1}
/* Content layer */
.ccont{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;padding:4px 2px 2px}
/* Status tag at top */
.ctag{font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:800;letter-spacing:.5px;padding:1px 3px;border-radius:2px;white-space:nowrap;text-align:center;line-height:1.3;margin-bottom:3px;width:100%}
/* Vertical text area */
.cvert{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;width:100%}
.cnum-v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;letter-spacing:1.5px;white-space:nowrap;line-height:1;text-overflow:ellipsis;overflow:hidden;max-height:80px}
.ccli-v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:600;letter-spacing:.8px;white-space:nowrap;opacity:.55;margin-top:4px;line-height:1;text-overflow:ellipsis;overflow:hidden;max-height:40px}

/* Libre box */
.cbox.libre{border:1.5px dashed rgba(255,255,255,.1);background:rgba(255,255,255,.02)}
.cbox.libre .ccont{justify-content:center}
.libre-plus{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.15);color:rgba(255,255,255,.2);transition:all .2s}
.cbox.libre:hover .libre-plus{border-color:var(--green);color:var(--green);box-shadow:0 0 8px rgba(0,195,137,.3)}
.libre-lbl{font-family:'Barlow Condensed',sans-serif;font-size:7px;color:rgba(255,255,255,.18);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:4px}

/* State neon borders */
.cbox.entrada{border-color:var(--blue);box-shadow:0 0 10px rgba(0,153,230,.35),inset 0 0 6px rgba(0,153,230,.06)}
.cbox.salida{border-color:var(--amber);box-shadow:0 0 10px rgba(245,162,11,.35)}
.cbox.pend-insp{border-color:var(--red);box-shadow:0 0 14px rgba(255,68,68,.5),inset 0 0 8px rgba(255,68,68,.08);animation:nred 1.3s ease-in-out infinite}
.cbox.inspeccionado{border-color:var(--green);box-shadow:0 0 10px rgba(0,195,137,.35)}
.cbox.proximo{border-color:rgba(255,255,255,.4);box-shadow:0 0 10px rgba(255,255,255,.15);animation:nwhite 2s ease-in-out infinite}
.cbox.p20{border-color:var(--orange);box-shadow:0 0 8px rgba(255,104,48,.35)}
.cbox.p50{border-color:var(--amber);box-shadow:0 0 12px rgba(245,162,11,.4)}
.cbox.p100{border-color:var(--green);box-shadow:0 0 14px rgba(0,195,137,.5)}
.cbox.selected{border-color:#fff!important;box-shadow:0 0 20px rgba(255,255,255,.4)!important;animation:nwhite-fast .6s ease-in-out infinite!important}
.cbox.dest-available{border-color:var(--green)!important;box-shadow:0 0 14px rgba(0,195,137,.5)!important;animation:npulse-g .8s ease-in-out infinite!important}
.cbox.libre.dest-available{border-style:solid!important;background:rgba(0,195,137,.06)!important}

@keyframes nred{0%,100%{box-shadow:0 0 10px rgba(255,68,68,.4)}50%{box-shadow:0 0 22px rgba(255,68,68,.7),0 0 40px rgba(255,68,68,.3)}}
@keyframes nwhite{0%,100%{box-shadow:0 0 8px rgba(255,255,255,.1)}50%{box-shadow:0 0 16px rgba(255,255,255,.25)}}
@keyframes nwhite-fast{0%,100%{box-shadow:0 0 14px rgba(255,255,255,.3)}50%{box-shadow:0 0 28px rgba(255,255,255,.6)}}
@keyframes npulse-g{0%,100%{box-shadow:0 0 10px rgba(0,195,137,.4)}50%{box-shadow:0 0 22px rgba(0,195,137,.7)}}

/* Chassis / wheels */
.chassis{width:36px;display:flex;justify-content:space-around;padding:0 4px;margin-top:3px}
.wheel{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#252250,#0c0a28);border:2px solid #1e1c50;box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 0 4px rgba(0,0,0,.5);position:relative}
.wheel::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#302e70;border:1px solid #4040a0}

/* ── DRIVE LANE ── */
.dlane{background:linear-gradient(90deg,#06041a 0%,#080620 50%,#06041a 100%);border-left:1px solid var(--b1);border-right:1px solid var(--b1);height:26px;display:flex;align-items:center;padding:0 10px;gap:8px;overflow:hidden;position:relative}
.dlane::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,transparent 0px,transparent 12px,rgba(245,162,11,.15) 12px,rgba(245,162,11,.15) 22px);transform:translateY(-50%)}
.dlane-lbl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.12);position:relative;z-index:1;background:var(--bg);padding:0 4px;white-space:nowrap}
.dlane.dest-active::before{background:repeating-linear-gradient(90deg,transparent 0px,transparent 10px,rgba(0,195,137,.2) 10px,rgba(0,195,137,.2) 20px);animation:lane-flow .8s linear infinite}
@keyframes lane-flow{from{background-position:0 0}to{background-position:20px 0}}

/* ── BUFFER ZONE ── */
.bzone{background:linear-gradient(0deg,#050315 0%,#07051e 100%);border-radius:0 0 6px 6px;border:1px solid var(--b1);border-top:none;padding-bottom:8px}
.bzone-hdr{display:flex;align-items:center;padding:6px 10px 4px;gap:8px}
.bzone-lbl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.2);text-transform:uppercase}
.bzone-pill{background:rgba(245,162,11,.12);border:1px solid rgba(245,162,11,.25);color:var(--amber);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;box-shadow:0 0 6px rgba(245,162,11,.15)}
.bscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bscroll::-webkit-scrollbar{display:none}
.binner{display:flex;padding:0 10px;gap:8px;min-width:max-content;align-items:flex-end}
.bslot{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.bpipe{width:2px;height:8px;background:rgba(245,162,11,.15);margin:0 auto 3px}
.bnum{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;color:rgba(255,255,255,.18);letter-spacing:.5px;margin-top:2px}
/* Buffer container (shorter) */
.bbox{width:36px;height:90px;background:linear-gradient(180deg,#0e0b28 0%,#080520 100%);border:2px solid rgba(255,255,255,.1);border-radius:3px;position:relative;overflow:hidden;cursor:pointer;transition:all .2s}
.bbox::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 5px,rgba(255,255,255,.02) 5px,rgba(255,255,255,.02) 6px);pointer-events:none;z-index:2}
.bbox-cont{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;padding:3px 2px 2px}
.bbox.libre-b{border:1.5px dashed rgba(255,255,255,.08);background:rgba(255,255,255,.01)}
.bbox.libre-b.dest-available{border:1.5px solid var(--green)!important;background:rgba(0,195,137,.04)!important;box-shadow:0 0 10px rgba(0,195,137,.3)!important;animation:npulse-g .8s ease-in-out infinite!important}
.bbox.entrada{border-color:var(--blue);box-shadow:0 0 8px rgba(0,153,230,.3)}
.bbox.salida{border-color:var(--amber);box-shadow:0 0 8px rgba(245,162,11,.3)}
.bbox.selected{border-color:#fff!important;box-shadow:0 0 16px rgba(255,255,255,.4)!important;animation:nwhite-fast .6s ease-in-out infinite!important}
.no-buf{padding:6px 10px;font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.15);text-align:center;text-transform:uppercase}
.scroll-hint{font-size:8px;color:rgba(255,255,255,.15);text-align:right;padding:2px 4px;font-style:italic}
.user-btn{width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:left;color:#fff;}
.user-btn:active{transform:scale(.98);opacity:.9;}
.sup-btn{border-color:rgba(0,195,137,.4);background:rgba(0,195,137,.08);}
.sup-btn:hover,.sup-btn:active{background:rgba(0,195,137,.18);border-color:var(--green);box-shadow:0 0 14px rgba(0,195,137,.3);}
.cli-btn{border-color:rgba(62,60,144,.5);background:rgba(62,60,144,.1);}
.cli-btn:hover,.cli-btn:active{background:rgba(62,60,144,.22);border-color:var(--primary);box-shadow:0 0 12px rgba(62,60,144,.3);}
.ubtn-label{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:1px;flex:1;}
.ubtn-sub{font-size:10px;color:var(--t3);letter-spacing:.5px;}
.ubtn-divider{font-size:9px;font-weight:700;color:var(--t4);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:4px 0;}

/* ── POST SECTION ── */
.psect{padding:8px 12px 0}
.psect-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.psect-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.psect-cnt{background:rgba(0,195,137,.12);border:1px solid rgba(0,195,137,.25);color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:90px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pcard{width:250px;flex-shrink:0;background:var(--card);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s}
.pcard:hover{border-color:var(--b2);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.pcard-hdr{padding:10px 12px 8px;border-bottom:1px solid var(--b0)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between}
.pcard-num{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--t)}
.pcard-cli{font-size:10px;color:var(--t3);margin-top:1px}
.ptipo{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px}
.pte{background:rgba(0,153,230,.15);color:var(--blue)} .pts{background:rgba(245,162,11,.12);color:var(--amber)}

// ══ MOVE MODE ══
function startMove(opId){moveState={active:true,opId};closeMod();document.getElementById('moveBanner').classList.add('active');renderDockView();}
function cancelMove(){moveState={active:false,opId:null};document.getElementById('moveBanner').classList.remove('active');renderDockView();}
function handleRampTap(b,r){
  if(moveState.active){openMoveToRamp(moveState.opId,b,r);}
  else{const op=getRampOp(b,r);op?openDetail(op.id):openAssign(b,r);}
}
function handleBufTap(b,pos,opId){
  if(moveState.active&&!opId){openMoveToBuf(moveState.opId,b,pos);}
  else if(opId){openDetail(opId);}
  else{openAssignBuf(b,pos);}
}
function openMoveToRamp(opId,b,r){
  const op=getOps().find(o=>o.id===opId);if(!op)return;
  mtitle.textContent=`Mover a ${r} — ${b}`;
  mbody.innerHTML=`
    <div class="abox info">Mover <strong>${op.contenedor}</strong> de ${op.rampa||'buffer'} a <strong>${r}</strong></div>
    <button class="btn-p btn-green" onclick="execMove('${opId}','rampa','${b}','${r}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      Confirmar traslado
    </button>
    <button class="btn-p btn-navy" style="margin-top:4px;" onclick="cancelMove();closeMod()">Cancelar</button>`;
  openMod();
}
function openMoveToBuf(opId,b,pos){
  const op=getOps().find(o=>o.id===opId);if(!op)return;
  mtitle.textContent=`Mover a Buffer B${pos}`;
  mbody.innerHTML=`
    <div class="abox info">Mover <strong>${op.contenedor}</strong> a buffer posición <strong>B${pos}</strong></div>
    <div class="abox warn" style="margin-top:0;">¿El cargue/descargue está completado?</div>
    <button class="btn-p btn-green" onclick="execMove('${opId}','buffer-done','${b}','${pos}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      Sí — completado, mover a buffer
    </button>
    <button class="btn-p btn-amber" style="margin-top:4px;" onclick="execMove('${opId}','buffer-move','${b}','${pos}')">
      Solo reubicar (sin completar)
    </button>
    <button class="btn-p btn-navy" style="margin-top:4px;" onclick="cancelMove();closeMod()">Cancelar</button>`;
  openMod();
}
function execMove(opId,type,b,dest){
  const ops=getOps();const idx=ops.findIndex(o=>o.id===opId);if(idx<0)return;
  if(type==='rampa'){
    ops[idx].rampa=dest;ops[idx].bodega=b;
    ops[idx].estado=ops[idx].tipo==='SALIDA'&&!ops[idx].inspeccionCompleta?'PEND_INSP':'EN_RAMPA';
    ops[idx].log.push({ev:`Movido a ${dest} — ${b}`,ts:new Date().toISOString()});
  }else if(type==='buffer-done'){
    ops[idx].estado='P100';ops[idx].rampa=null;
    ops[idx].log.push({ev:`100% completado — movido a buffer B${dest}`,ts:new Date().toISOString()});
    setTimeout(()=>openDestinoMod(opId),600);
  }else{
    ops[idx].rampa=null;ops[idx].estado='ESPERA_RAMPA';
    ops[idx].log.push({ev:`Reubicado a buffer B${dest}`,ts:new Date().toISOString()});
  }
  ops[idx].actualizadoEn=new Date().toISOString();
  saveOps(ops);cancelMove();closeMod();refresh();
  toast('Contenedor movido',true);
}

function renderDockView(){

function renderDock(b){
  const ops=getOps();const R=CFG[b].rampas;const BN=CFG[b].buffer;
  // Wall doors
  let doors=`<div class="wh-bodlbl">${b}</div>`;
  for(let r=1;r<=R;r++){doors+=`<div class="rdoor"><div class="dframe"><div class="dseal"></div><div class="dnum">R${r}</div></div></div>`;}
  // Ramp slots
  let rslots='';
  for(let r=1;r<=R;r++){
    const op=getRampOp(b,'R'+r);
    const isDestAvail=moveState.active&&!op;
    rslots+=`<div class="rslot"><div class="rpipe"></div>${op?buildCBox(op,isDestAvail,false):buildFreeBox(b,'R'+r,isDestAvail)}<div class="chassis"><div class="wheel"></div><div class="wheel"></div></div></div>`;
  }
  // Buffer zone
  let bufHtml='';
  if(BN>0){
    const bops=ops.filter(o=>o.bodega===b&&o.estado==='ESPERA_RAMPA');
    let bslots='';
    for(let i=1;i<=BN;i++){
      const bop=bops[i-1]||null;
      const isDA=moveState.active&&!bop;
      bslots+=`<div class="bslot"><div class="bpipe"></div>${bop?buildBBox(bop,false):buildFreeBBox(b,i,isDA)}<div class="bnum">B${i}</div></div>`;
    }
    const bc=bops.length;
    bufHtml=`<div class="bzone"><div class="bzone-hdr"><div class="bzone-lbl">Buffer de espera</div>${bc>0?`<div class="bzone-pill">${bc} en cola</div>`:''}</div><div class="bscroll"><div class="binner">${bslots}</div></div></div>`;
  }else{bufHtml=`<div class="bzone"><div class="no-buf">MSL — sin zona buffer</div></div>`;}
  return `<div class="dock-wrap"><div class="dock-scene">
    <div class="wh-wall"><div class="wh-inner">${doors}</div></div>
    <div class="rscroll"><div class="rinner">${rslots}</div></div>
    <div class="dlane"><div class="dlane-lbl">ZONA DE MANIOBRA</div></div>
    ${bufHtml}
  </div>${R>4?'<div class="scroll-hint">← deslizar para ver más →</div>':''}</div>`;
}

function buildCBox(op,isDestAvail,isBuf){
  const s=ST[op.estado];
  const isSelected=moveState.active&&moveState.opId===op.id;
  const fillH=op.estado==='P20'?25:op.estado==='P50'?55:op.estado==='P100'?100:5;
  const fillColor=op.tipo==='ENTRADA'?'rgba(0,153,230,0.25)':op.estado==='P100'?'rgba(0,195,137,0.25)':'rgba(245,162,11,0.2)';
  const sc={EN_RAMPA:'',PEND_INSP:'pend-insp',INSPECCIONADO:'inspeccionado',PROXIMO:'proximo',P20:'p20',P50:'p50',P100:'p100'}[op.estado]||(op.tipo==='ENTRADA'?'entrada':'salida');
  const tagBg=op.tipo==='ENTRADA'?'rgba(0,153,230,.2)':'rgba(245,162,11,.15)';
  const tagC=op.tipo==='ENTRADA'?'#0099e6':'#f5a20b';
  const boxClass=isBuf?'bbox':'cbox';
  const ht=isBuf?'90':'148';
  const selCls=isSelected?' selected':'';
  var clickFn=isBuf?("handleBufTap('"+op.bodega+"',0,'"+op.id+"')"):"handleRampTap('"+op.bodega+"','"+( op.rampa||'')+"')";
  const contNum=op.contenedor.substring(0,4)+'···'+op.contenedor.slice(-4);
  const cliShort=op.cliente.substring(0,6).toUpperCase();
  if(isBuf){
    return `<div class="${boxClass} ${op.tipo.toLowerCase()}${selCls}" onclick="${clickFn}">
      <div class="cfill" style="height:${fillH}%;background:${fillColor};"></div>
      <div class="bbox-cont" style="position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;padding:3px 2px;">
        <div class="ctag" style="background:${tagBg};color:${tagC};font-size:6px;">${s.s}</div>

function saveInsp(opId,doShare=false){
  const inspector=document.getElementById('ii-insp')?.value.trim()||'';
  const tc=document.getElementById('ii-tc')?.value||'';
  const com=document.getElementById('ii-com')?.value.trim()||'';
  let fail=false;AIDS.forEach(id=>{const v=inspA[id];if(!v)return;if(NEGS.includes(id)&&v==='SI')fail=true;if(!NEGS.includes(id)&&v==='NO')fail=true;});
  const answered=Object.keys(inspA).length;
  const result=answered===AIDS.length?(fail?'no-apto':'apto'):'parcial';
  const insp={answers:{...inspA},result,inspector,tipoContenedor:tc,comentarios:com,fecha:new Date().toISOString(),itemFotos:{...inspIP},globalFotos:[...inspGP]};
  const ops=getOps();const idx=ops.findIndex(o=>o.id===opId);if(idx<0)return null;
  ops[idx].inspeccion=insp;ops[idx].inspeccionCompleta=true;ops[idx].estado='INSPECCIONADO';if(tc)ops[idx].tipoContenedor=tc;
  ops[idx].log.push({ev:`Inspección: ${result==='apto'?'APTO':result==='no-apto'?'NO APTO':'PARCIAL'} · ${inspector||'—'}`,ts:new Date().toISOString()});
  ops[idx].actualizadoEn=new Date().toISOString();
  saveOps(ops);inspA={};
  if(!doShare){closeMod();refresh();toast(result==='apto'?'Inspección APTO — listo para cargue':'Inspección NO APTO',result!=='no-apto');}
  return ops[idx];
}

async function saveAndShareInsp(opId){
  const op=saveInsp(opId,true);if(!op)return;
  closeMod();refresh();toast('Generando PDF…');
  await new Promise(r=>setTimeout(r,200));
  try{
    const blob=await buildInspPDF(op);
    const fname=`Inspeccion_${op.contenedor}_${op.bodega}.pdf`;
    if(navigator.share&&navigator.canShare){
      const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare({files:[file]})){await navigator.share({title:`Inspección ${op.contenedor} — DP World`,files:[file]});toast('PDF compartido',true);return;}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);
    toast('PDF descargado',true);
  }catch(e){if(e.name!=='AbortError')toast('Error al compartir');}
}

function buildCliCBox(op,isMine,dimmed,clickFn,isBuf=false){

  const tagBg=op.tipo==='ENTRADA'?'rgba(0,153,230,.2)':'rgba(245,162,11,.15)';
  const tagC=op.tipo==='ENTRADA'?'#0099e6':'#f5a20b';
  const ht=isBuf?90:148;
  const dimStyle=dimmed?'opacity:0.15;filter:grayscale(0.7);cursor:default;':'cursor:pointer;';
  const clickAttr=clickFn&&isMine?`onclick="${clickFn}"`:'';
