<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control de Rampas — DP World</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');
:root{
  --primary:#3E3C90;--pk:#2D2B6B;
  --green:#00C389;--gd:#00a372;--gg:rgba(0,195,137,.5);
  --red:#E8003D;--rg:rgba(232,0,61,.45);
  --blue:#0099e6;--bg2:rgba(0,153,230,.45);
  --amber:#f5a20b;--ag:rgba(245,162,11,.4);
  --orange:#ff6830;
  --bg:#0d0b28;--surf:#16143d;--card:#1e1c50;--raised:#252368;
  --b0:rgba(255,255,255,.05);--b1:rgba(255,255,255,.1);--b2:rgba(255,255,255,.18);
  --t:#fff;--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.3);--t4:rgba(255,255,255,.12);
  --r:10px;--r2:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}

/* HEADER */
.hdr{background:linear-gradient(90deg,var(--pk) 0%,var(--primary) 100%);border-bottom:1px solid var(--b1);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:50px;position:sticky;top:0;z-index:90;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo{width:28px;height:28px;flex-shrink:0}
.hdr-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px;line-height:1}
.hdr-sub{font-size:9px;color:var(--green);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

/* STATS */
.stats{display:flex;background:rgba(13,10,46,.8);border-bottom:1px solid var(--b0)}
.sbox{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--b0)}
.sbox:last-child{border-right:none}
.sn{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1}
.sn.sl{color:rgba(255,255,255,.25)}.sn.en{color:var(--blue)}.sn.sa{color:var(--amber)}.sn.ok{color:var(--green)}.sn.bf{color:var(--orange)}
.sl2{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);margin-top:1px}

/* TABS */
.tabs{display:flex;padding:8px 12px 6px;gap:6px;background:var(--bg)}
.tab{flex:1;padding:8px 4px;border-radius:6px;border:1px solid var(--b1);background:var(--b0);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--t3);cursor:pointer;transition:all .2s;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tab.active{border-color:var(--primary);background:rgba(62,60,144,.2);color:#fff;box-shadow:0 0 10px rgba(62,60,144,.3)}

/* MOVE BANNER */
.mvbanner{background:rgba(0,195,137,.1);border:1px solid rgba(0,195,137,.3);border-radius:8px;padding:8px 12px;margin:0 12px 6px;display:none;align-items:center;justify-content:space-between}
.mvbanner.on{display:flex}
.mvbanner-t{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--green)}
.mvbanner-x{background:rgba(232,0,61,.15);border:1px solid rgba(232,0,61,.3);color:#ff8888;padding:5px 12px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation}

/* DOCK */
.dock-wrap{padding:0 12px 8px}
.wh-wall{background:linear-gradient(180deg,#1a1760 0%,#0f0e3a 100%);border-radius:6px 6px 0 0;border:1px solid rgba(255,255,255,.08);border-bottom:3px solid var(--green);display:flex;align-items:flex-end;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wh-wall::-webkit-scrollbar{display:none}
.wh-inner{display:flex;padding:6px 10px 0;gap:8px;min-width:max-content}
.wh-bl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(0,195,137,.3);text-transform:uppercase;padding:0 6px 8px;align-self:flex-start;white-space:nowrap;flex-shrink:0}
.rdoor{width:36px;flex-shrink:0;text-align:center}
.dframe{background:#060420;border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:3px 3px 0 0;height:28px;position:relative;display:flex;align-items:center;justify-content:center}
.dframe::before,.dframe::after{content:'';position:absolute;bottom:0;width:5px;height:13px;background:repeating-linear-gradient(0deg,var(--amber) 0px,var(--amber) 4px,#0a0820 4px,#0a0820 7px);border-radius:1px 1px 0 0}
.dframe::before{left:2px}.dframe::after{right:2px}
.dseal{width:100%;height:3px;background:repeating-linear-gradient(90deg,rgba(0,195,137,.3) 0px,rgba(0,195,137,.3) 2px,transparent 2px,transparent 5px);position:absolute;bottom:0}
.dnum{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;color:rgba(255,255,255,.35);letter-spacing:.5px}
.rscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#0d0a2e 0%,#0a0820 100%);border-left:1px solid var(--b1);border-right:1px solid var(--b1)}
.rscroll::-webkit-scrollbar{display:none}
.rinner{display:flex;padding:6px 10px 4px;gap:8px;min-width:max-content;align-items:flex-end}
.rslot{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.rpipe{width:2px;height:10px;background:linear-gradient(180deg,rgba(0,195,137,.4) 0%,rgba(0,195,137,.05) 100%);margin:0 auto 3px}

/* CONTAINER */
.cbox{width:36px;height:148px;background:linear-gradient(180deg,#0e0b28 0%,#0a0820 100%);border:2px solid rgba(255,255,255,.12);border-radius:3px;position:relative;overflow:hidden;cursor:pointer;transition:all .25s;flex-shrink:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cbox::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 5px,rgba(255,255,255,.025) 5px,rgba(255,255,255,.025) 6px);pointer-events:none;z-index:2}
.cfill{position:absolute;bottom:0;left:0;right:0;transition:height .7s cubic-bezier(.4,0,.2,1);z-index:1}
.ccont{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;padding:4px 2px 2px}
.ctag{font-family:'Barlow Condensed',sans-serif;font-size:7px;font-weight:800;letter-spacing:.5px;padding:1px 3px;border-radius:2px;white-space:nowrap;text-align:center;line-height:1.3;margin-bottom:3px;width:100%}
.cvert{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.ctext-v{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:1.2px;white-space:nowrap;line-height:1.3;overflow:hidden;flex:1}
.cbox.libre{border:1.5px dashed rgba(255,255,255,.1);background:rgba(255,255,255,.02)}
.cbox.libre .ccont{justify-content:center}
.libre-plus{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.15);color:rgba(255,255,255,.2);transition:all .2s}
.cbox.libre:hover .libre-plus,.cbox.libre:active .libre-plus{border-color:var(--green);color:var(--green)}
.libre-lbl{font-family:'Barlow Condensed',sans-serif;font-size:7px;color:rgba(255,255,255,.18);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.cbox.entrada{border-color:var(--blue);box-shadow:0 0 10px rgba(0,153,230,.35)}
.cbox.salida{border-color:var(--amber);box-shadow:0 0 10px rgba(245,162,11,.35)}
.cbox.pend-insp{border-color:var(--red);box-shadow:0 0 14px rgba(232,0,61,.5);animation:nred 1.3s ease-in-out infinite}
.cbox.inspeccionado{border-color:var(--green);box-shadow:0 0 10px var(--gg)}
.cbox.proximo{border-color:rgba(255,255,255,.4);box-shadow:0 0 10px rgba(255,255,255,.15);animation:nwhite 2s ease-in-out infinite}
.cbox.p20{border-color:var(--orange);box-shadow:0 0 8px rgba(255,104,48,.35)}
.cbox.p50{border-color:var(--amber);box-shadow:0 0 12px var(--ag)}
.cbox.p100{border-color:var(--green);box-shadow:0 0 14px var(--gg)}
.cbox.selected{border-color:#fff!important;box-shadow:0 0 20px rgba(255,255,255,.4)!important;animation:nwf .6s ease-in-out infinite!important}
.cbox.dest-av{border-color:var(--green)!important;box-shadow:0 0 14px var(--gg)!important;animation:npg .8s ease-in-out infinite!important}
.cbox.libre.dest-av{border-style:solid!important;background:rgba(0,195,137,.06)!important}
@keyframes nred{0%,100%{box-shadow:0 0 10px rgba(232,0,61,.4)}50%{box-shadow:0 0 22px rgba(232,0,61,.7),0 0 40px rgba(232,0,61,.3)}}
@keyframes nwhite{0%,100%{box-shadow:0 0 8px rgba(255,255,255,.1)}50%{box-shadow:0 0 16px rgba(255,255,255,.25)}}
@keyframes nwf{0%,100%{box-shadow:0 0 14px rgba(255,255,255,.3)}50%{box-shadow:0 0 28px rgba(255,255,255,.6)}}
@keyframes npg{0%,100%{box-shadow:0 0 10px var(--gg)}50%{box-shadow:0 0 22px rgba(0,195,137,.7)}}

/* CHASSIS */
.chassis{width:36px;display:flex;justify-content:space-around;padding:0 4px;margin-top:3px}
.wheel{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#252250,#0c0a28);border:2px solid #1e1c50;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);position:relative}
.wheel::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:#302e70;border:1px solid #4040a0}

/* BUFFER BOX */
.bbox{width:36px;height:90px;background:linear-gradient(180deg,#0e0b28 0%,#080520 100%);border:2px solid rgba(255,255,255,.1);border-radius:3px;position:relative;overflow:hidden;cursor:pointer;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bbox::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0px,transparent 5px,rgba(255,255,255,.02) 5px,rgba(255,255,255,.02) 6px);pointer-events:none;z-index:2}
.bbox.libre-b{border:1.5px dashed rgba(255,255,255,.08);background:rgba(255,255,255,.01)}
.bbox.libre-b.dest-av{border:1.5px solid var(--green)!important;background:rgba(0,195,137,.04)!important;box-shadow:0 0 10px var(--gg)!important;animation:npg .8s ease-in-out infinite!important}
.bbox.entrada{border-color:var(--blue);box-shadow:0 0 8px rgba(0,153,230,.3)}
.bbox.salida{border-color:var(--amber);box-shadow:0 0 8px rgba(245,162,11,.3)}
.bbox.selected{border-color:#fff!important;box-shadow:0 0 16px rgba(255,255,255,.4)!important;animation:nwf .6s ease-in-out infinite!important}
.bzone{background:linear-gradient(0deg,#050315 0%,#07051e 100%);border-radius:0 0 6px 6px;border:1px solid var(--b1);border-top:none;padding-bottom:8px}
.bzone-hdr{display:flex;align-items:center;padding:6px 10px 4px;gap:8px}
.bzone-lbl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.2);text-transform:uppercase}
.bzone-pill{background:rgba(245,162,11,.12);border:1px solid rgba(245,162,11,.25);color:var(--amber);font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}
.bscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bscroll::-webkit-scrollbar{display:none}
.binner{display:flex;padding:0 10px;gap:8px;min-width:max-content;align-items:flex-end}
.bslot{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.bpipe{width:2px;height:8px;background:rgba(245,162,11,.15);margin:0 auto 3px}
.bnum{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;color:rgba(255,255,255,.18);letter-spacing:.5px;margin-top:2px}
.no-buf{padding:8px 10px;font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.15);text-align:center;text-transform:uppercase}
.dlane{background:linear-gradient(90deg,#06041a 0%,#080620 50%,#06041a 100%);border-left:1px solid var(--b1);border-right:1px solid var(--b1);height:26px;display:flex;align-items:center;padding:0 10px;overflow:hidden;position:relative}
.dlane::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,transparent 0px,transparent 12px,rgba(245,162,11,.15) 12px,rgba(245,162,11,.15) 22px);transform:translateY(-50%)}
.dlane-lbl{font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.12);position:relative;z-index:1;background:var(--bg);padding:0 4px;white-space:nowrap}
.scroll-hint{font-size:8px;color:rgba(255,255,255,.15);text-align:right;padding:2px 4px;font-style:italic}

/* POST-RAMP */
.psect{padding:8px 12px 0}
.psect-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.psect-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t3)}
.psect-cnt{background:rgba(0,195,137,.12);border:1px solid rgba(0,195,137,.25);color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:90px;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pcard{width:250px;flex-shrink:0;background:var(--card);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;touch-action:manipulation}
.pcard:hover{border-color:var(--b2)}
.pcard-hdr{padding:10px 12px 8px;border-bottom:1px solid var(--b0)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between}
.pcard-num{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--t)}
.pcard-cli{font-size:10px;color:var(--t3);margin-top:1px}
.ptipo{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px}
.pte{background:rgba(0,153,230,.15);color:var(--blue)}.pts{background:rgba(245,162,11,.12);color:var(--amber)}
.pstate-row{padding:8px 12px 4px;display:flex;align-items:center;gap:6px}
.pstate-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pstate-lbl{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700}
.pipeline{padding:4px 12px 8px;display:flex;align-items:center;overflow:hidden}
.pip-d{width:18px;height:18px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0}
.pip-d.done{background:var(--green);border-color:var(--green);color:var(--bg);box-shadow:0 0 6px var(--gg)}
.pip-d.cur{border-color:var(--t);color:var(--t);background:rgba(255,255,255,.1)}
.pip-d.fut{border-color:var(--b1);color:var(--t4)}
.pip-l{width:10px;height:1.5px;flex-shrink:0}
.pip-l.done{background:var(--green)}.pip-l.fut{background:var(--b0)}
.pcard-act{padding:0 12px 10px}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end}
.mov.hidden{display:none!important;pointer-events:none!important;visibility:hidden!important}
.msheet{background:linear-gradient(180deg,#13113e 0%,#0f0c38 100%);border:1px solid var(--b2);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:20px;animation:sup .28s cubic-bezier(.4,0,.2,1)}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mhandle{width:32px;height:3px;background:var(--b2);border-radius:2px;margin:10px auto 0}
.mhdr{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b0)}
.mtitle{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--t)}
.mclose{width:28px;height:28px;border-radius:50%;background:var(--b0);border:1px solid var(--b1);color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;touch-action:manipulation;font-size:18px;line-height:1}
.mbody{padding:14px 16px 6px}

/* FORM ELEMENTS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.flbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.fin{border:1.5px solid var(--b1);border-radius:7px;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--t);background:rgba(255,255,255,.04);width:100%;transition:border-color .2s}
.fin:focus{outline:none;border-color:var(--green);background:rgba(0,195,137,.04)}
.ig2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

/* TIPO SELECTOR */
.tipo-sel{display:flex;gap:8px;margin-bottom:14px}
.tipo-btn{flex:1;padding:14px 8px;border-radius:var(--r);border:1.5px solid var(--b1);background:var(--b0);text-align:center;cursor:pointer;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tipo-lbl{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--t3);display:block;margin-top:4px}
.tipo-sub{font-size:10px;color:var(--t4);display:block;margin-top:2px}
.tipo-btn.ent.act{border-color:var(--blue);background:rgba(0,153,230,.1)}.tipo-btn.ent.act .tipo-lbl{color:var(--blue)}
.tipo-btn.sal.act{border-color:var(--amber);background:rgba(245,162,11,.1)}.tipo-btn.sal.act .tipo-lbl{color:var(--amber)}

/* ALERTS */
.abox{border-radius:7px;padding:9px 12px;margin-bottom:10px;font-size:12px;font-weight:600;line-height:1.4;display:flex;align-items:flex-start;gap:8px}
.abox.warn{background:rgba(245,162,11,.08);border:1px solid rgba(245,162,11,.25);color:var(--amber)}
.abox.err{background:rgba(232,0,61,.08);border:1px solid rgba(232,0,61,.25);color:#ff6680}
.abox.suc{background:rgba(0,195,137,.08);border:1px solid rgba(0,195,137,.25);color:var(--green)}

/* PROGRESS */
.prog-row{display:flex;gap:7px;margin-bottom:12px}
.pbtn{flex:1;padding:14px 4px;border-radius:var(--r);border:1.5px solid;text-align:center;cursor:pointer;transition:all .2s;font-family:'Barlow Condensed',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pbtn .pn{font-size:22px;font-weight:800;line-height:1}
.pbtn .pl{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);margin-top:3px}
.pbtn.p20{border-color:rgba(255,104,48,.3);background:rgba(255,104,48,.06)}.pbtn.p20 .pn{color:var(--orange)}.pbtn.p20:active{background:rgba(255,104,48,.18);border-color:var(--orange)}
.pbtn.p50{border-color:rgba(245,162,11,.3);background:rgba(245,162,11,.06)}.pbtn.p50 .pn{color:var(--amber)}.pbtn.p50:active{background:rgba(245,162,11,.18);border-color:var(--amber)}
.pbtn.p100{border-color:rgba(0,195,137,.3);background:rgba(0,195,137,.06)}.pbtn.p100 .pn{color:var(--green)}.pbtn.p100:active{background:rgba(0,195,137,.18);border-color:var(--green)}

/* DESTINATION */
.dest-col{display:flex;flex-direction:column;gap:8px}
.dbtn{padding:14px;border-radius:var(--r);border:1.5px solid;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dbtn.puerto{border-color:rgba(0,195,137,.3);background:rgba(0,195,137,.06)}.dbtn.puerto .dt{color:var(--green)}.dbtn.puerto:active{background:rgba(0,195,137,.18)}
.dbtn.buffer{border-color:rgba(245,162,11,.3);background:rgba(245,162,11,.06)}.dbtn.buffer .dt{color:var(--amber)}.dbtn.buffer:active{background:rgba(245,162,11,.18)}
.dbtn.docs{border-color:rgba(232,0,61,.3);background:rgba(232,0,61,.06)}.dbtn.docs .dt{color:#ff6680}.dbtn.docs:active{background:rgba(232,0,61,.18)}
.dic{width:26px;height:26px;flex-shrink:0}.dt{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;display:block}.ds{font-size:10px;color:var(--t3);margin-top:1px;display:block}

/* OP DETAIL */

var drag = {
  active: false, opId: null, ghost: null,
  timer: null, startX: 0, startY: 0, sourceEl: null
};

function startDragTimer(el, opId, touch) {
  clearDragTimer();
  drag.opId = opId; drag.sourceEl = el;
  drag.startX = touch.clientX; drag.startY = touch.clientY;
  drag.timer = setTimeout(function() { activateDrag(el, opId); }, 400);
}
function clearDragTimer() { if(drag.timer) { clearTimeout(drag.timer); drag.timer=null; } }

function activateDrag(el, opId) {
  drag.active = true; drag.opId = opId;
  if(navigator.vibrate) navigator.vibrate(60);
  var rect = el.getBoundingClientRect();
  var g = document.createElement('div');
  g.className = 'drag-ghost';
  g.style.width = rect.width+'px'; g.style.height = rect.height+'px';
  g.style.left = (drag.startX - rect.width/2)+'px';
  g.style.top = (drag.startY - rect.height*0.7)+'px';
  g.innerHTML = el.innerHTML;
  document.body.appendChild(g);
  drag.ghost = g;
  el.style.opacity = '0.25';
  renderDockView();
  document.getElementById('mvbanner').classList.add('on');
  document.getElementById('mvbanner').querySelector('.mvbanner-t').textContent = 'Suelta en la rampa o buffer destino';
}

function moveDrag(touch) {
  if(!drag.ghost) return;
  var w = parseInt(drag.ghost.style.width);
  var h = parseInt(drag.ghost.style.height);
  drag.ghost.style.left = (touch.clientX - w/2)+'px';
  drag.ghost.style.top = (touch.clientY - h*0.7)+'px';
}

function endDrag(touch) {
  clearDragTimer();
  if(!drag.active) { drag.opId=null; return; }
  var opId = drag.opId;
  if(drag.ghost) { drag.ghost.remove(); drag.ghost=null; }
  if(drag.sourceEl) { drag.sourceEl.style.opacity=''; drag.sourceEl=null; }
  drag.active = false; drag.opId = null;
  document.getElementById('mvbanner').classList.remove('on');
  renderDockView();
  // Detect drop target
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  if(!el) return;
  var target = el;
  while(target && !target.dataset.drop) { target = target.parentElement; }
  if(!target) return;
  var b = target.dataset.bodega;
  var existingOp = null;
  if(target.dataset.opId) existingOp = target.dataset.opId;
  if(target.dataset.drop==='ramp') {
    var r = target.dataset.rampa;
    if(!r) return;
    var occupied = getRampOp(b, r);
    if(!occupied) { openMoveToRamp(opId, b, r); }
  } else if(target.dataset.drop==='buf') {
    var pos = parseInt(target.dataset.pos)||0;
    openMoveToBuf(opId, b, pos);
  }
}

function getRampOp(b, r) {
  var ops = getOps();

}

// ═══ RENDER ═══
function refresh() { renderStats(); renderDockView(); renderPost(); }

function renderStats() {
  var ops = getOps(); var lib=0, en=0, sa=0, bf=0;
  var bods = ['CLP','MSL'];
  for(var bi=0; bi<bods.length; bi++) {
    var b = bods[bi];
    for(var r=1; r<=CFG[b].rampas; r++) {
      var op = getRampOp(b,'R'+r);
      if(!op) lib++; else if(op.tipo==='ENTRADA') en++; else sa++;
    }
  }
  bf = ops.filter(function(o){ return o.estado==='ESPERA_RAMPA'; }).length;
  var h = '<div class="sbox"><div class="sn sl">'+lib+'</div><div class="sl2">Libres</div></div>';
  h += '<div class="sbox"><div class="sn en">'+en+'</div><div class="sl2">Entrada</div></div>';
  h += '<div class="sbox"><div class="sn sa">'+sa+'</div><div class="sl2">Salida</div></div>';
  h += '<div class="sbox"><div class="sn bf">'+bf+'</div><div class="sl2">Buffer</div></div>';
  h += '<div class="sbox"><div class="sn ok">'+getPostOps().length+'</div><div class="sl2">Transito</div></div>';
  document.getElementById('stats').innerHTML = h;
}

function renderDockView() {
  var bods = bod==='AMBAS' ? ['CLP','MSL'] : [bod];
  var h = '';
  for(var i=0; i<bods.length; i++) {
    if(bod==='AMBAS') {
      h += '<div style="margin:8px 12px 4px;font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(0,195,137,.3);text-transform:uppercase;">' + CFG[bods[i]].label + ' \u2014 ' + bods[i] + '</div>';
    }
    h += renderDock(bods[i]);
  }
  document.getElementById('dockArea').innerHTML = h;
  document.querySelectorAll('.dlane').forEach(function(el) {
    el.classList.toggle('dest-active', mvState.active);
  });
}

function renderDock(b) {
  var ops = getOps();
  var R = CFG[b].rampas;
  var BN = CFG[b].buffer;

  // Wall doors
  var doors = '<div class="wh-bl">' + b + '</div>';
  for(var r=1; r<=R; r++) {
    doors += '<div class="rdoor"><div class="dframe"><div class="dseal"></div><div class="dnum">R'+r+'</div></div></div>';
  }

  // Ramp slots
  var rslots = '';
  for(var r=1; r<=R; r++) {
    var op = getRampOp(b,'R'+r);
    var isDA = mvState.active && !op;
    var box = op ? buildCBox(op, false) : buildFreeBox(b, 'R'+r, isDA);
    rslots += '<div class="rslot"><div class="rpipe"></div>' + box + '<div class="chassis"><div class="wheel"></div><div class="wheel"></div></div></div>';
  }

  // Buffer
  var bufHtml = '';
  if(BN > 0) {
    var bops = ops.filter(function(o){ return o.bodega===b && (o.estado==='ESPERA_RAMPA'||o.estado==='BUFFER_POST'); });
    var bslots = '';
    for(var i=1; i<=BN; i++) {
      var bop = bops[i-1] || null;
      var isDA2 = mvState.active && !bop;
      var bbox = bop ? buildCBox(bop, false, true) : buildFreeBBox(b, i, isDA2);
      bslots += '<div class="bslot"><div class="bpipe"></div>' + bbox + '<div class="bnum">B'+i+'</div></div>';
    }
    var pill = bops.length > 0 ? '<div class="bzone-pill">'+bops.length+' en cola</div>' : '';
    bufHtml = '<div class="bzone"><div class="bzone-hdr"><div class="bzone-lbl">Buffer de espera</div>' + pill + '</div><div class="bscroll"><div class="binner">' + bslots + '</div></div></div>';
  } else {
    bufHtml = '<div class="bzone"><div class="no-buf">MSL sin zona buffer</div></div>';
  }

  var hint = R > 4 ? '<div class="scroll-hint">&#8592; deslizar &#8594;</div>' : '';
  return '<div class="dock-wrap"><div class="dock-scene"><div class="wh-wall"><div class="wh-inner">' + doors + '</div></div><div class="rscroll"><div class="rinner">' + rslots + '</div></div><div class="dlane"><div class="dlane-lbl">ZONA DE MANIOBRA</div></div>' + bufHtml + '</div>' + hint + '</div>';
}

function buildCBox(op, isDA, isBuf) {
  var s = ST[op.estado] || ST['EN_RAMPA'];
  var fillH = op.estado==='P20'?25 : op.estado==='P50'?55 : op.estado==='P100'?100 : 5;
  var fillColor = op.tipo==='ENTRADA' ? 'rgba(0,153,230,0.25)' : op.estado==='P100'||op.estado==='BUFFER_POST' ? 'rgba(0,195,137,0.2)' : 'rgba(245,162,11,0.2)';
  var isPost = op.estado==='BUFFER_POST';
  var sc = {PEND_INSP:'pend-insp',INSPECCIONADO:'inspeccionado',PROXIMO:'proximo',P20:'p20',P50:'p50',P100:'p100',BUFFER_POST:'buffer-post'}[op.estado] || (op.tipo==='ENTRADA'?'entrada':'salida');
  var tagBg = isPost ? 'rgba(0,195,137,.15)' : op.tipo==='ENTRADA' ? 'rgba(0,153,230,.2)' : 'rgba(245,162,11,.15)';
  var tagC = isPost ? '#00C389' : op.tipo==='ENTRADA' ? '#0099e6' : '#f5a20b';
  var isSel = drag.active && drag.opId===op.id;
  var selCls = isSel ? ' selected' : '';
  var daCls = isDA ? ' dest-av' : '';
  var contNum = op.contenedor.substring(0,4) + '...' + op.contenedor.slice(-4);
  var cliShort = (op.cliente || '').substring(0,6).toUpperCase();
  var ht = isBuf ? 90 : 148;
  var boxCls = isBuf ? ('bbox ' + (isPost?'buffer-post':op.tipo.toLowerCase()) + selCls) : ('cbox ' + sc + selCls + daCls);
  var clickFn = isBuf ? "onRampTap('" + op.bodega + "','buf','" + op.id + "')" : "onRampTap('" + op.bodega + "','" + (op.rampa||'') + "','" + op.id + "')";
  var dataAttrs = ' data-op-id="'+op.id+'" data-drop="'+(isBuf?'buf':'ramp')+'" data-bodega="'+op.bodega+'" data-rampa="'+(op.rampa||'')+'"';
  var h = '<div class="' + boxCls + '"' + dataAttrs + ' style="height:' + ht + 'px;" onclick="' + clickFn + '">';
  h += '<div class="cfill" style="height:'+fillH+'%;background:'+fillColor+';"></div>';
  h += '<div class="ccont">';
  h += '<div class="ctag" style="background:'+tagBg+';color:'+tagC+';">'+s.s+'</div>';
  h += '<div class="cvert"><div class="ctext-v" style="color:'+s.c+';text-shadow:0 0 6px '+s.g+';">'+contNum+' '+cliShort+'</div></div>';
  h += '</div></div>';
  return h;
}

function buildFreeBox(b, r, isDA) {
  var daCls = isDA ? ' dest-av' : '';
  return '<div class="cbox libre' + daCls + '" onclick="onRampTap(\'' + b + '\',\'' + r + '\',\'\')">' +
    '<div class="ccont"><div class="libre-plus">' +
    '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
    '</div><div class="libre-lbl">Libre</div></div></div>';
}

function buildFreeBBox(b, pos, isDA) {
  var daCls = isDA ? ' dest-av' : '';
  return '<div class="bbox libre-b' + daCls + '" onclick="onBufTap(\'' + b + '\',' + pos + ',\'\')"></div>';
}

// ═══ TAP HANDLERS ═══
function onRampTap(b, r, opId) {
  if(mvState.active) {
    if(r === 'buf') { openMoveToBuf(mvState.opId, b, 0); }
    else if(!opId) { openMoveToRamp(mvState.opId, b, r); }
    return;
  }
  if(opId) { openDetail(opId); }
  else if(r !== 'buf') { openAssign(b, r); }
}
function onBufTap(b, pos, opId) {
  if(mvState.active && !opId) { openMoveToBuf(mvState.opId, b, pos); return; }
  if(opId) { openDetail(opId); }
  else { openAssignBuf(b, pos); }
}

// ═══ MOVE MODE ═══
function startMove(opId) {
  mvState = {active:true, opId:opId};
  closeMod();
  document.getElementById('mvbanner').classList.add('on');
  renderDockView();
}
function cancelMove() {
  mvState = {active:false, opId:null};
  document.getElementById('mvbanner').classList.remove('on');
  renderDockView();
}
function openMoveToRamp(opId, b, r) {
  var op = getOps().filter(function(o){ return o.id===opId; })[0];
  if(!op) return;
  document.getElementById('mtitle').textContent = 'Mover a ' + r + ' \u2014 ' + b;
  var h = '<div class="abox warn">Mover ' + op.contenedor + ' a rampa ' + r + '</div>';
  h += '<button class="btn-p btn-green" onclick="execMove(\''+opId+'\',\'rampa\',\''+b+'\',\''+r+'\')">';
  h += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Confirmar traslado</button>';
  h += '<button class="btn-p btn-navy" style="margin-top:4px;" onclick="cancelMove();closeMod()">Cancelar</button>';
  document.getElementById('mbody').innerHTML = h;
  openMod();
}
function openMoveToBuf(opId, b, pos) {
  var op = getOps().filter(function(o){ return o.id===opId; })[0];
  if(!op) return;
  document.getElementById('mtitle').textContent = 'Mover a buffer';
  var h = '<div class="abox warn">Mover ' + op.contenedor + ' al buffer</div>';
  h += '<div class="abox warn">El cargue/descargue esta completado?</div>';
  h += '<button class="btn-p btn-green" onclick="execMove(\''+opId+'\',\'buf-done\',\''+b+'\',\''+pos+'\')">';
  h += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>Si - completado, mover a buffer</button>';
  h += '<button class="btn-p btn-amber" style="margin-top:4px;" onclick="execMove(\''+opId+'\',\'buf-move\',\''+b+'\',\''+pos+'\')">Solo reubicar</button>';
  h += '<button class="btn-p btn-navy" style="margin-top:4px;" onclick="cancelMove();closeMod()">Cancelar</button>';
  document.getElementById('mbody').innerHTML = h;
  openMod();
}
function execMove(opId, type, b, dest) {
  var ops = getOps();
  var idx = -1;
  for(var i=0; i<ops.length; i++) { if(ops[i].id===opId) { idx=i; break; } }
  if(idx < 0) return;
  if(type==='rampa') {
    ops[idx].rampa = dest; ops[idx].bodega = b;
    ops[idx].estado = (ops[idx].tipo==='SALIDA' && !ops[idx].inspeccionCompleta) ? 'PEND_INSP' : 'EN_RAMPA';
    ops[idx].log.push({ev:'Movido a '+dest+' \u2014 '+b, ts:new Date().toISOString()});
  } else if(type==='buf-done') {
    ops[idx].estado = 'P100'; ops[idx].rampa = null;
    ops[idx].log.push({ev:'100% completado, movido a buffer', ts:new Date().toISOString()});
  } else {
    ops[idx].rampa = null; ops[idx].estado = 'ESPERA_RAMPA';
    ops[idx].log.push({ev:'Reubicado a buffer', ts:new Date().toISOString()});
  }
  ops[idx].actualizadoEn = new Date().toISOString();
  saveOps(ops); cancelMove(); closeMod(); refresh();
  showToast('Contenedor movido', true);
  if(type==='buf-done') { setTimeout(function(){ openDestinoMod(opId); }, 500); }
}

}
function confirmAssign() {
  var cont = (document.getElementById('acont')||{}).value; if(cont) cont = cont.trim().toUpperCase();
  var cli = (document.getElementById('acli')||{}).value; if(cli) cli = cli.trim().toUpperCase();
  if(!cont) { showToast('Ingresa el N de contenedor'); return; }
  if(!cli) { showToast('Ingresa el cliente'); return; }
  var op = {id:Date.now().toString(), bodega:aData.b, rampa:aData.r, tipo:aData.tipo, contenedor:cont, tipoContenedor:(document.getElementById('atc')||{}).value||'', cliente:cli, transportista:((document.getElementById('attr')||{}).value||'').trim(), estado:aData.tipo==='SALIDA'?'PEND_INSP':'EN_RAMPA', inspeccionCompleta:aData.tipo==='ENTRADA', inspeccion:null, log:[{ev:'Rampa asignada \u2014 '+aData.tipo, ts:new Date().toISOString()}], creadoEn:new Date().toISOString(), actualizadoEn:new Date().toISOString()};

// ═══ DETAIL MODAL ═══
function openDetail(opId) {
  var ops = getOps();
  var op = null; for(var i=0; i<ops.length; i++) { if(ops[i].id===opId) { op=ops[i]; break; } }
  if(!op) return;
  var s = ST[op.estado] || ST['EN_RAMPA'];
  var pct = op.estado==='P20'?20 : op.estado==='P50'?50 : op.estado==='P100'?100 : 0;
  var bc = op.tipo==='ENTRADA' ? '#0099e6' : op.estado==='P100' ? '#00C389' : '#f5a20b';
  var ni = op.tipo==='SALIDA' && !op.inspeccionCompleta;
  var ir = RS.indexOf(op.estado)>=0 && op.estado!=='ESPERA_RAMPA';
  var sp = ir && op.inspeccionCompleta && op.estado!=='P100';
  var sd = op.estado==='P100' && ir;
  document.getElementById('mtitle').textContent = (op.rampa || 'COLA') + ' \u2014 ' + op.bodega;
  var h = '<div class="op-dtop">';
  h += '<div style="display:flex;align-items:flex-start;justify-content:space-between;">';
  h += '<div><div class="op-big-r">' + (op.rampa||'COLA') + '</div>';
  h += '<div class="op-big-c" style="color:'+s.c+';">' + op.cliente + '</div>';
  h += '<div class="op-big-n">' + op.contenedor + ' ' + (op.tipoContenedor||'') + ' &middot; ' + op.tipo + (op.sello?' &middot; Sello: <strong>'+op.sello+'</strong>':'') + '</div></div>';
  h += '<div style="font-family:Barlow Condensed,sans-serif;font-size:12px;font-weight:700;color:'+s.c+';background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:4px 8px;border-radius:5px;box-shadow:0 0 10px '+s.g+';">'+s.l+'</div>';
  h += '</div>';
  if(pct > 0) {
    h += '<div class="bprog"><div class="bprogf" style="width:'+pct+'%;background:'+bc+';box-shadow:0 0 8px '+bc+'66;"></div></div>';
    h += '<div style="font-family:Barlow Condensed,sans-serif;font-size:11px;color:var(--t3);">'+pct+'% '+(op.tipo==='ENTRADA'?'descargado':'cargado')+'</div>';
  }
  h += '</div>';
  if(ni) {
    h += '<div class="abox err">Inspeccion SL-02-007 pendiente \u2014 el cargue no puede iniciar.</div>';
    h += '<button class="btn-p btn-red" onclick="closeMod();setTimeout(function(){openInsp(\''+opId+'\')},200)">INICIAR INSPECCION</button>';
  } else if(op.tipo==='SALIDA' && op.inspeccionCompleta && op.inspeccion) {
    h += '<div class="abox suc">Inspeccion OK \u2014 ' + (op.inspeccion.result==='apto'?'APTO':'NO APTO') + ' &middot; ' + (op.inspeccion.inspector||'') + '</div>';
  }
  if(sp) {
    h += '<div style="font-size:9px;font-weight:700;color:var(--t4);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;margin-top:4px;">ACTUALIZAR PROGRESO</div>';
    h += '<div class="prog-row">';
    h += '<div class="pbtn p20" onclick="updEstado(\''+opId+'\',\'P20\');closeMod()"><div class="pn">20%</div><div class="pl">Iniciando</div></div>';
    h += '<div class="pbtn p50" onclick="updEstado(\''+opId+'\',\'P50\');closeMod()"><div class="pn">50%</div><div class="pl">Mitad</div></div>';
    h += '<div class="pbtn p100" onclick="updEstado(\''+opId+'\',\'P100\');closeMod()"><div class="pn">100%</div><div class="pl">Completo</div></div>';
    h += '</div>';
  }
  if(sd) {
    h += '<div style="font-size:9px;font-weight:700;color:var(--t4);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;margin-top:4px;">DESTINO FINAL</div>';
    h += buildDestButtons(opId);
  }
  if(op.estado==='EN_RAMPA' && op.inspeccionCompleta) {
    h += '<button class="btn-p btn-navy" onclick="updEstado(\''+opId+'\',\'PROXIMO\');closeMod()">Marcar Proximo Cargue/Descargue</button>';
  }
  if(op.estado==='ESPERA_RAMPA') {
    h += '<button class="btn-p btn-amber" onclick="closeMod();setTimeout(function(){openMoveAssign(\''+opId+'\')},200)">Asignar a Rampa</button>';
  }
  if(ir) {
    h += '<button class="btn-p btn-navy" style="margin-top:4px;" onclick="startMove(\''+opId+'\')">Mover contenedor</button>';
  }
  var log = op.log || [];
  h += '<div class="tl"><div class="tl-h">Actividad</div>';
  var recent = log.slice(-4).reverse();
  for(var i=0; i<recent.length; i++) {
    h += '<div class="tl-it"><div class="tl-dot"></div><div><div class="tl-txt">'+recent[i].ev+'</div><div class="tl-time">'+fmtT(recent[i].ts)+'</div></div></div>';
  }
  if(!recent.length) h += '<div style="font-size:11px;color:var(--t4);">Sin actividad</div>';
  h += '</div>';
  h += '<button class="btn-dang" onclick="liberarRampa(\''+opId+'\')">Liberar rampa</button>';

function buildPipeSteps(steps, ci) {
  var h = '';
  for(var i=0; i<steps.length; i++) {
    var cls = i<ci ? 'done' : i===ci ? 'cur' : 'fut';
    var inner = i<ci ? '&#10003;' : i===ci ? '&#9679;' : '';
    h += '<div class="cstep"><div class="pip-d ' + cls + '">' + inner + '</div>';
    if(i < steps.length-1) { h += '<div class="pip-l ' + (i<ci?'done':'fut') + '"></div>'; }
    h += '</div>';
  }
  return h;
}

function saveInsp(opId, doShare) {
  var inspector = (document.getElementById('ii-insp')||{}).value || '';
  var tc = (document.getElementById('ii-tc')||{}).value || '';
  var com = (document.getElementById('ii-com')||{}).value || '';
  var fail = false;
  for(var i=0; i<AIDS.length; i++) {
    var id = AIDS[i]; var v = inspA[id]; if(!v) continue;
    if(NEGS.indexOf(id)>=0 && v==='SI') fail=true;
    if(NEGS.indexOf(id)<0 && v==='NO') fail=true;
  }
  var answered = Object.keys(inspA).length;
  var result = answered===AIDS.length ? (fail?'no-apto':'apto') : 'parcial';
  var insp = {answers:{}, result:result, inspector:inspector, tipoContenedor:tc, comentarios:com, fecha:new Date().toISOString(), itemFotos:{}, globalFotos:inspGP.slice()};
  for(var k in inspA) insp.answers[k] = inspA[k];
  for(var k in inspIP) insp.itemFotos[k] = inspIP[k];
  var ops = getOps(); var idx=-1;
  for(var i=0; i<ops.length; i++) { if(ops[i].id===opId) { idx=i; break; } }
  if(idx<0) return null;
  ops[idx].inspeccion = insp; ops[idx].inspeccionCompleta = true; ops[idx].estado = 'INSPECCIONADO';
  if(tc) ops[idx].tipoContenedor = tc;
  ops[idx].log.push({ev:'Inspeccion: '+(result==='apto'?'APTO':result==='no-apto'?'NO APTO':'PARCIAL')+' - '+(inspector||'--'), ts:new Date().toISOString()});
  ops[idx].actualizadoEn = new Date().toISOString();
  saveOps(ops); inspA = {};
  var op = ops[idx];
  if(!doShare) {
    closeMod(); refresh();
    showToast(result==='apto'?'Inspeccion APTO - listo para cargue':'Inspeccion NO APTO', result!=='no-apto');
    return op;
  }
  closeMod(); refresh();
  showToast('Generando PDF...');
  buildAndSharePDF(op);
  return op;
}

async function buildAndSharePDF(op) {
  try {
    var jsPDF = window.jspdf && window.jspdf.jsPDF;
    if(!jsPDF) { showToast('PDF no disponible'); return; }
    var doc = new jsPDF({unit:'mm', format:'a4'});
    var W=210, M=14, y=0;
    var navy=[26,16,96], green=[0,195,137], white=[255,255,255], gray=[90,96,117], lg=[240,241,245], red=[232,0,61];
    doc.setFillColor.apply(doc,navy); doc.rect(0,0,W,30,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor.apply(doc,white);
    doc.text('DP WORLD PANAMA', M, 11);
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor.apply(doc,green);
    doc.text('FORMULARIO DE INSPECCION DE CONTENEDORES - SL-02-007', M, 17);
    doc.setTextColor(180,180,200); doc.setFontSize(7);
    doc.text('Generado: '+new Date().toLocaleString('es-PA')+' - '+op.bodega, M, 23);
    var insp = op.inspeccion;
    var bc = insp&&insp.result==='apto' ? green : insp&&insp.result==='no-apto' ? red : [200,150,0];
    doc.setFillColor.apply(doc,bc); doc.roundedRect(W-M-34,8,34,14,3,3,'F');
    doc.setTextColor.apply(doc,navy); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(insp&&insp.result==='apto'?'APTO':insp&&insp.result==='no-apto'?'NO APTO':'PARCIAL', W-M-17, 17, {align:'center'});
    y=36;
    doc.setFillColor.apply(doc,lg); doc.rect(M,y,W-M*2,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor.apply(doc,navy);
    doc.text('INFORMACION GENERAL', M+2, y+4); y+=8;
    var fi=[['Contenedor',op.contenedor],['Tipo',op.tipoContenedor],['Cliente',op.cliente],['Bodega',op.bodega],['Inspector',insp&&insp.inspector||'--'],['Fecha',new Date((insp&&insp.fecha)||'').toLocaleString('es-PA')]];
    var cw=(W-M*2)/2, rh=8;
    for(var i=0; i<fi.length; i++) {
      var col=i%2, row=Math.floor(i/2), x=M+col*cw, fy=y+row*rh;
      if(row%2===0){doc.setFillColor(250,250,252);doc.rect(x,fy,cw,rh,'F');}
      doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor.apply(doc,gray);doc.text(fi[i][0]+':', x+2, fy+3);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor.apply(doc,navy);doc.text(fi[i][1]||'--', x+2, fy+7);
    }
    y += Math.ceil(fi.length/2)*rh+5;
    function chkPg(n){ if(y+n>277){doc.addPage();y=14;} }
    for(var si=0; si<CL.length; si++) {
      var sec = CL[si];
      chkPg(12); doc.setFillColor.apply(doc,navy); doc.rect(M,y,W-M*2,6,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor.apply(doc,white);
      doc.text(sec.id+'. '+sec.n, M+3, y+4.3); y+=8;
      for(var ii=0; ii<sec.items.length; ii++) {
        var it = sec.items[ii];
        var ans = insp&&insp.answers&&insp.answers[it.id];
        var iPh = insp&&insp.itemFotos&&insp.itemFotos[it.id];
        chkPg(8+(iPh?22:0));
        var bg=ii%2===0?[249,249,252]:[255,255,255]; doc.setFillColor.apply(doc,bg); doc.rect(M,y,W-M*2,7,'F');
        var isN=NEGS.indexOf(it.id)>=0;
        var lines=doc.splitTextToSize(it.id+'. '+it.q, W-M*2-28);
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(45,49,72);doc.text(lines,M+2,y+4.2);
        if(ans){var ok=(!isN&&ans==='SI')||(isN&&ans==='NO');doc.setFillColor.apply(doc,ok?[232,250,244]:[253,236,234]);doc.roundedRect(W-M-18,y+1.5,16,4,1,1,'F');doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor.apply(doc,ok?[0,163,114]:red);doc.text(ans==='SI'?'SI':'NO',W-M-10,y+4.2,{align:'center'});}
        y+=7+(lines.length>1?(lines.length-1)*3.5:0);
        if(iPh){try{doc.setFillColor.apply(doc,lg);doc.rect(M,y,W-M*2,21,'F');doc.addImage(iPh,'JPEG',M+2,y+1,26,19,undefined,'MEDIUM');y+=23;}catch(e){y+=3;}}
      }
      y+=3;
    }
    if(insp&&insp.comentarios){chkPg(14);doc.setFillColor.apply(doc,lg);doc.rect(M,y,W-M*2,5,'F');doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor.apply(doc,navy);doc.text('COMENTARIOS',M+2,y+3.5);y+=7;doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(45,49,72);var cl=doc.splitTextToSize(insp.comentarios,W-M*2-4);doc.text(cl,M+2,y+3.5);y+=cl.length*4.5+5;}
    if(insp&&insp.globalFotos&&insp.globalFotos.length>0){doc.addPage();y=14;var cols=3,iw=(W-M*2-8)/cols,ih=iw*.75;for(var gi=0;gi<insp.globalFotos.length;gi++){var gcol=gi%cols,grow=Math.floor(gi/cols);if(gcol===0&&grow>0&&y+ih+5>277){doc.addPage();y=14;}var gx=M+gcol*(iw+4),gfy=y+grow*(ih+5);try{doc.addImage(insp.globalFotos[gi],'JPEG',gx,gfy,iw,ih,undefined,'MEDIUM');}catch(e){}}}
    var pages=doc.getNumberOfPages();
    for(var p=1;p<=pages;p++){doc.setPage(p);doc.setFillColor.apply(doc,navy);doc.rect(0,287,W,10,'F');doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(180,180,200);doc.text('DP World Panama - DAL Colon - SL-02-007',M,293);doc.text('Pag.'+p+'/'+pages,W-M,293,{align:'right'});}
    var blob = doc.output('blob');
    var fname = 'Inspeccion_'+op.contenedor+'_'+op.bodega+'.pdf';
    if(navigator.share && navigator.canShare) {
      var file = new File([blob], fname, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})) {
        await navigator.share({title:'Inspeccion '+op.contenedor, files:[file]});
        showToast('PDF compartido', true); return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=fname; a.click();
    URL.revokeObjectURL(url); showToast('PDF descargado', true);
  } catch(e) { showToast('Error generando PDF'); }
}

// ═══ MODAL & HELPERS ═══
function openMod() { document.getElementById('mov').classList.remove('hidden'); }
function closeMod() { document.getElementById('mov').classList.add('hidden'); }
function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok?' ok':'');
  setTimeout(function(){ t.className='toast'; }, 2600);
}
function fmtT(iso) {
  if(!iso) return '';
  try { var d=new Date(iso); return d.toLocaleString('es-PA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e) { return ''; }
}

// ═══ INIT ═══
document.addEventListener('DOMContentLoaded', function() {
  loadDemo();
  refresh();

  document.getElementById('mclose').addEventListener('click', closeMod);
  document.getElementById('mov').addEventListener('click', function(e){ if(e.target===this) closeMod(); });
  document.getElementById('mvcancel').addEventListener('click', cancelMove);
  document.getElementById('gfInput').addEventListener('change', addGF);

  // Drag system - event delegation on dock area
  var dockArea = document.getElementById('dockArea');
  dockArea.addEventListener('touchstart', function(e) {
    var el = e.target.closest('[data-op-id]');
    if(el && el.dataset.opId) { startDragTimer(el, el.dataset.opId, e.touches[0]); }
  }, {passive:true});
  dockArea.addEventListener('touchmove', function(e) {
    if(drag.active) { e.preventDefault(); moveDrag(e.touches[0]); }
    else {
      var dx = Math.abs(e.touches[0].clientX - drag.startX);
      var dy = Math.abs(e.touches[0].clientY - drag.startY);
      if(dx > 10 || dy > 10) clearDragTimer();
    }
  }, {passive:false});
  dockArea.addEventListener('touchend', function(e) {
    if(drag.active) { endDrag(e.changedTouches[0]); }
    else clearDragTimer();
  }, {passive:true});
  dockArea.addEventListener('touchcancel', function() {
    clearDragTimer();
    if(drag.ghost) { drag.ghost.remove(); drag.ghost=null; }
    if(drag.sourceEl) { drag.sourceEl.style.opacity=''; drag.sourceEl=null; }
    drag.active=false; drag.opId=null;
    document.getElementById('mvbanner').classList.remove('on');
    renderDockView();
  }, {passive:true});

  var tabs = ['CLP','MSL','AMBAS'];
  tabs.forEach(function(t) {
    var el = document.getElementById('tab-'+t);
    if(el) el.addEventListener('click', function() {
      bod = t;
      tabs.forEach(function(x){ var e=document.getElementById('tab-'+x); if(e) e.classList.toggle('active',x===t); });
      renderDockView();
    });
  });
});
</script>
